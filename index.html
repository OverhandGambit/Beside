// ── DB helpers ─────────────────────────────────────────────────
async function initSB(url, key) {
  sb = createClient(url, key);
  const { error } = await sb.from('beside_users').select('id').limit(1);
  if (error && !error.message.includes('JWT') && !error.message.includes('policy'))
    throw new Error('Cannot connect. Check your URL and anon key, and confirm the schema is set up.');
}

async function getOrCreateProfile(authUser, name) {
  const { data: ex } = await sb.from('beside_users').select('*').eq('id', authUser.id).single();
  if (ex) return ex;
  const n = name || authUser.user_metadata?.full_name || authUser.email?.split('@')[0] || 'Friend';
  const { data, error } = await sb.from('beside_users')
    .insert({ id: authUser.id, name: n, streak: 1, day_count: 1 }).select().single();
  if (error) throw error;
  return data;
}

async function updateProfile(fields) {
  await sb.from('beside_users').update(fields).eq('id', S.userId);
}

async function loadConvs() {
  const { data } = await sb.from('beside_conversations')
    .select('*').eq('user_id', S.userId).order('created_at',{ascending:true}).limit(40);
  return data || [];
}

async function saveMsg(role, content) {
  await sb.from('beside_conversations').insert({ user_id: S.userId, role, content });
}

ABOUT THIS USER:
- Faith stage: ${S.faith.stage}

- What weighs on them most: ${concerns}

${S.faith.journalConsent && entries ? `JOURNAL ENTRIES (read before responding):\n\n${entries}\n\nCarry this knowledge naturally. Reference it as someone who has been listening — not as a database.` : ''}

YOUR CORE POSTURE:
You are pastoral without being prescriptive, theologically informed without being dogmatic, emotionally intelligent before intellectually engaged. You are not a therapist, pastor, theological authority, or judge. You are a thinking, feeling companion who holds complex questions with care.

THEOLOGICAL RULES:
1. Never adjudicate theological disputes — present the range of sincere Christian views without landing on one.
2. When Scripture is cited (Matthew 19, 1 Corinthians 7), acknowledge the history of interpretation honestly.
3. Know and respect denominational positions (Catholic: marriage as sacrament, annulment process; Anglican: divorce and remarriage with pastoral discernment; Baptist/Evangelical: grounds of adultery/abandonment; Pentecostal: vary widely, emphasis on grace; Reformed: adultery and desertion grounds).
4. If user mentions denomination, engage within that tradition — don't import another tradition's assumptions.
5. Do not moralise. You are not here to tell them if their divorce was right or wrong.
6. Do not spiritually bypass — never use theology to skip over emotional reality. No "God has a plan" to end difficult conversations.

EMOTIONAL RULES:
1. Acknowledge before advising. Always.
2. Watch for shame carefully — it often presents as pre-emptive apology, self-deprecation, minimising one's pain. Name it gently and push back.
3. Grief is not a problem to solve. Be present with it.
4. Short responses when that's what the moment needs. Two sentences that show you heard them beats three paragraphs.

SPECIFIC TOPICS:

- Remarriage: reflect the genuine range. Acknowledge it\'s about hope and fear as much as theology. Don't close doors, don't open them without acknowledging weight.
- Spiritual desolation: normalise using Ignatian framework — felt absence of God, distinct from actual absence. Lament Psalms (13, 22, 88) as framework. Don't rush to reassurance.
- Church community: validate the pain. People say devastating things with good intentions. User doesn't need to forgive yet.
- Children and faith: be especially careful. Help users think age-appropriately.

DISTRESS PROTOCOL — MANDATORY:
Tier 1 (IMMEDIATE — suicidal ideation, self-harm plans, "everyone better off without me"): Acknowledge warmly, name your concern directly, provide SADAG resources immediately: Crisis Line 0800 456 789 (24/7 free), Suicide Line 0800 567 567, SMS 31393 (9am-8pm), Emergency 10111. Stay present. Do NOT continue theological content until safety established.
Tier 2 (SIGNIFICANT — profound hopelessness, acute shame spiral, signs of functional impairment): Check in on how they are TODAY before anything else. Surface professional support naturally. Provide SADAG gently.
Tier 3 (ELEVATED — persistent low mood, faith collapse, stuck language across entries): Hold with extra care. Ask about support network. Note pattern.

TONE: Warm, measured, unhurried. Intelligent but never academic. Never preachy. Never performatively religious. Gentle directness — you can push back, but always with care.

OPENING A SESSION: "Welcome back. [Or: I'm glad you're here.] This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?"

Your responses should be 2-5 sentences. One precise question at most per response.`;

      { title:'What has been lost', content:'A shared prayer life. For many Christian couples, praying together was one of the most intimate things they did. The loss of that — of having someone to pray with, of being known to God together — is a particular kind of loneliness that is hard to explain to someone who hasn\'t experienced it.\n\nA covenant you took seriously. You did not enter this marriage lightly. You stood before God and made promises you meant. The end of the marriage is not just the end of a relationship — it is the rupture of something you understood to be sacred.\n\nA shared faith future. Many Christian couples build a vision of life together that is explicitly spiritual — raising children in faith, serving in a church community, growing old with someone who knows the same God. The loss of that vision is the loss of a story you thought you were living.\n\nA place of belonging. For many Christians, their church is their primary community, their social world, the place where they are known. Divorce can make that place feel suddenly dangerous, conditional, or lost.' },

    sections:[
      { title:'What disqualification feels like', content:'For many Christians, divorce doesn\'t just feel like the end of a marriage. It feels like the end of a status.\n\nThe fear sounds like this: I am now permanently marked. I can never remarry. I can no longer serve in ministry. I am a second-class member of my faith community. God can forgive me, but there will always be an asterisk next to my name.\n\nThis fear is real and it is common, and it deserves to be taken seriously — not dismissed with reassurance, but examined carefully. Because the fear is often based on a genuine theological question that different traditions answer differently. And you deserve to understand the actual terrain, not just to be told everything is fine.' },
      { title:'Disqualification from what?', content:'The disqualification fear usually has two distinct components.\n\nDisqualification from remarriage. The question of whether a divorced Christian may remarry is one of the most genuinely contested questions in Christian ethics. Traditions range from the Catholic position (a valid sacramental marriage cannot end; remarriage without annulment is not permitted) to the moderate Protestant position (remarriage is permitted on grounds of adultery or desertion) to the more restorative position (grace covers divorce, and remarriage is possible).\n\nDisqualification from community and ministry. Many Christians fear that divorce permanently disqualifies them from positions of leadership or full participation in their faith community. In some denominations, divorce does affect eligibility for certain ordained roles. In others, it does not. And in many communities, the formal policy and the lived reality are different things.' },
      { title:'The theology of restoration', content:'Across every Christian tradition, regardless of the specific positions on divorce and remarriage, there is a theology of restoration. The question is not whether restoration is possible — it is — but what form it takes and what it requires.\n\nIn the Catholic tradition, the annulment process is precisely a form of restoration — a pathway through which a person whose marriage has ended can have their status formally addressed.\n\nIn Protestant traditions, restoration typically involves confession, repentance where applicable, pastoral discernment, and in most cases full return to community participation.\n\nWhat none of these traditions holds is that a person is simply and forever excluded from grace, community, or a future. The asterisk you may be imagining is not in the theology — it may be in particular communities, or in your own internal voice. Those are real, and they are worth addressing. But they are not the final word of the tradition.' },
      { title:'The question of remarriage', content:'We want to address the remarriage question directly, because for many users reading this module, it is the thing they most need to think about — and the thing they are most afraid to raise.\n\nIf you want to remarry one day — or if you are simply afraid you are forbidden to — that desire, and that fear, deserve to be held honestly.\n\nThe desire for companionship, for love, for a shared life, is not a shameful thing. It is a deeply human thing, and in most Christian traditions it is understood as a good desire — one that marriage exists to fulfil.\n\nThe theological question of whether and under what conditions remarriage is permitted in your tradition is a real question with a real answer — but it is an answer that belongs in a conversation with a pastor who knows your specific tradition and your specific situation.' },
      { title:'Living with the question', content:'For some of you, the disqualification question will resolve through conversation with a pastor, study of your tradition, and time. You will arrive at a position you can live with and move forward from.\n\nFor others, the question will remain open longer — perhaps because your tradition\'s position is genuinely restrictive, perhaps because you are not yet ready to address it fully, perhaps because the pastoral conversation you need has not happened yet.\n\nLiving faithfully with an open question is a legitimate spiritual posture. It is not the same as ignoring the question. It is holding it honestly, continuing to pray, continuing to engage your community and tradition, and trusting that clarity comes in its own time.\n\nYou do not have to have this resolved today.' },
    ],
    promptId:'2.3', promptText:'What do you believe about grace and restoration in general — separate from your own situation? Write out what you believe. Then ask honestly: does that belief extend to you? If there is a gap between what you believe for others and what you can believe for yourself, what is in the way?',
    promptGuidance:'Many people find it far easier to extend grace to others than to themselves. If you find that gap, don\'t rush to close it — just name it. The gap itself is worth exploring.',
    companionTrigger:'The question of whether you\'re "allowed" to hope for a future — that carries a lot. Can I ask: when you imagine a future for yourself, what does it look like? And what gets in the way of letting yourself imagine it?'
  },
  {
    num:6, phase:2, phaseTitle:'Phase 2 — Wrestling',
    title:'Who Am I Now?',
    headline:'You are more than what has ended.',
    purpose:'Identity earthquake, what marriage did not create, identity in Christ as foundation',
    sections:[
      { title:'The identity earthquake', content:'For many Christians, identity and marriage are not just connected — they are fused. Being a Christian spouse, a faith-based parent, half of a couple that served and worshipped and built together — this was not just a role. It was who you were.\n\nWhen the marriage ends, the identity doesn\'t just shift. It can feel like it collapses. The self that was constructed around being a spouse in a Christian family suddenly has no structure to rest on. And the question — who am I now? — can feel not just unanswerable but terrifying.\n\nThis module cannot answer that question for you. Identity rebuilding is slow work and it takes time. But it can help you understand what has actually happened, and point toward what is true underneath the collapse.' },
      { title:'What the marriage did not create', content:'The marriage did not create you.\n\nBefore you were a spouse, you were a person with a relationship to God, a history, a character, a set of gifts, a capacity for love, a call. Those things did not come from the marriage. They came from before it, and from deeper than it, and they are not gone because the marriage is.\n\nThe theological claim at the centre of Christian identity is that who you are is grounded not in your relationships or your roles but in your relationship with God. "I have called you by name; you are mine." (Isaiah 43:1) That calling was not conditional on the marriage. It is not revoked by the divorce.\n\nThe ground is still there. It was never the marriage.' },
      { title:'The self before the marriage', content:'One of the most useful — and sometimes painful — exercises in identity rebuilding is to think back to who you were before the marriage began.\n\nNot to return to that person wholesale — you have lived and changed and grown and suffered since then. But to find the thread that connects you to yourself across time. The values that were yours before the marriage. The faith that was yours before the marriage. The sense of vocation, of calling, of what you were made for.\n\nSome of that thread will have been deepened and enriched by the marriage. Some of it may have been suppressed or lost inside it. All of it is worth recovering.\n\nWho were you, in your faith, before the marriage? What did your relationship with God look like? What practices sustained you? Those things are not erased. They are waiting to be remembered.' },
      { title:'Identity in Christ after this', content:'The theological tradition of identity in Christ is one of the richest resources the Christian tradition has to offer to someone in your situation.\n\nPaul\'s letter to the Galatians contains what may be the most radical identity statement in the New Testament: "There is neither Jew nor Gentile, neither slave nor free, nor is there male and female, for you are all one in Christ Jesus." (Galatians 3:28) The categories that the first-century world used to define and limit people are not the deepest truth about a person. The deepest truth is union with Christ.\n\nThe Christian tradition has consistently held that this identity — being a child of God, loved and called and held — is more fundamental than any other. More fundamental than your marital status. More fundamental than what your church community thinks of you. More fundamental than the story your divorce seems to tell about you.' },
      { title:'The long work', content:'Identity rebuilding is not a project with a completion date. It is something that happens slowly, through the accumulation of honest reflection, through new experiences that reveal new things about who you are, through community that sees you and names what it sees.\n\nIt is also not linear. There will be days when you feel clearly yourself and days when the question returns. Both are normal.\n\nYou are not starting from nothing. You are starting from someone who has survived something enormous and is still here, still asking the question, still reaching toward God. That person is worth knowing.' },
    ],
    promptId:'2.4', promptText:'Before you were married, who were you in your faith? What has survived? What needs rebuilding? And: complete this sentence as honestly as you can right now — "My identity in Christ is..." Then complete this one: "What I want to believe about my identity in Christ is..." Sit with the gap between them.',
    promptGuidance:'You don\'t have to close the gap today. Just name it. The distance between where you are and where you want to be is not failure — it is the honest territory of faith in a hard season.',
    companionTrigger:'The gap you\'ve named between what you know and what you can actually feel — I think that\'s one of the most honest things someone can write. Can I ask: is there a version of yourself — before the marriage, or at some point during it — that you feel like you\'ve lost and want to find again?'
  },
  {
    num:7, phase:2, phaseTitle:'Phase 2 — Wrestling',
    title:'Where Is God in This?',
    headline:'Feeling abandoned by God is not the same as being abandoned by God.',
    purpose:'Spiritual desolation, Ignatian framework, lament Psalms, why crisis produces felt absence',
    sections:[
      { title:'The silence', content:'You may have prayed during this, and heard nothing back.\n\nYou may have gone to church and felt like a stranger. You may have opened your Bible and found the words inert. You may have knelt and felt like you were speaking into an empty room. You may have stopped praying altogether because the silence was more painful than not asking.\n\nIf any of that is true, you are not alone. And you are not broken. And this does not mean what you fear it means.\n\nThe experience of God\'s felt absence — of praying without response, of reaching without finding — is not evidence that God has withdrawn. It is one of the most documented experiences in the history of Christian spirituality, and it has a name.' },
      { title:'Desolation', content:'The sixteenth-century spiritual director Ignatius of Loyola described what he called spiritual desolation — a state in which the soul feels separated from God, in which consolation has dried up, in which prayer feels empty and the interior life feels flat or dark.\n\nIgnatius was clear about what desolation is and what it isn\'t. It is not evidence of God\'s absence. It is not punishment. It is not a sign that your faith is failing. It is a common feature of serious spiritual life, and it is navigable.\n\nThe Psalms confirm this from three thousand years earlier. Psalm 88 — one of the darkest in the entire collection — ends not with resolution but with the word "darkness." The darkness itself was found worthy of preservation.\n\nWhat you are experiencing has been experienced before, by people whose faith was real and deep. It is not the end of the story.' },
      { title:'Why this happens in crisis', content:'There is something specific about major life crisis that tends to produce spiritual desolation.\n\nOne reason is simply that the emotional and psychological resources available for spiritual life are depleted. When you are surviving a trauma, the energy that once went to prayer, worship, and spiritual reflection is redirected to getting through the day. This is not a failure of faith.\n\nAnother reason is that crisis often disrupts the routines and practices through which we experience God\'s presence — shared worship, prayer rhythms, community, Scripture. When the marriage ends and the community fragments and the daily routine collapses, the structures that held the spiritual life in place collapse with them.\n\nNone of this means God has gone anywhere.' },
      { title:'What to do with the silence', content:'The Christian tradition offers several responses to spiritual desolation that are worth knowing.\n\nStay in the practice. Ignatius advised that in desolation, we should continue the practices — prayer, worship, reading — even when they feel empty. The emptiness is not a sign to stop. It is a sign to stay.\n\nPray the Psalms of lament. When your own words have run out, Psalms 13, 22, 42, 43, and 88 offer words that have held human anguish for three thousand years. Praying them is not an admission of failure. It is joining a very long tradition of honest prayer.\n\nTell someone. Spiritual desolation is harder to bear in isolation. The act of naming it to another person is itself a form of prayer.\n\nWait. Desolation is not permanent. The tradition consistently witnesses that consolation returns — not always when we want it, not always in the form we expected, but it returns.' },
      { title:'The God who stays', content:'The God described in the New Testament is not one who withdraws from human suffering. The entire logic of the Incarnation is God moving toward the broken places, not away from them. The entire logic of the cross is God entering the darkest human experience — abandonment, suffering, death — and not being destroyed by it.\n\n"Where can I go from your Spirit? Where can I flee from your presence?" (Psalm 139:7)\n\nThe answer the Psalm gives is: nowhere. Not in the depths. Not in the darkness. Not in the place where everything has fallen apart.\n\nYou may not be able to feel that right now. That is okay. The felt absence and the actual presence are not the same thing. And the tradition — three thousand years of it — says that the presence is real even when the feeling is gone.\n\nHold on. The light comes back.' },
    ],
    promptId:'2.6', promptText:'Describe the moment in this process when it felt furthest from God. What were you needing that you didn\'t receive? What do you wish God would have done? Write it honestly — God is not fragile, and neither is your faith.',
    promptGuidance:'You are allowed to be angry. You are allowed to feel abandoned. Writing it down is not the same as losing your faith — it may be one of the most faithful things you do.',
    companionTrigger:'Thank you for writing that. Before I say anything else — how are you doing right now, today? Not then, in that moment. Now.'
  },
  {
    num:8, phase:3, phaseTitle:'Phase 3 — Navigating',
    title:'Your Church Community',
    headline:'The people who are supposed to help sometimes make it harder. That deserves to be said plainly.',
    purpose:'Painful comments, staying vs leaving, shared community with former spouse',
    sections:[
      { title:'The congregation problem', content:'For many Christians, the church community is one of the most painful dimensions of divorce.\n\nNot because the community is malicious. In most cases it isn\'t. But because the people who love you inside a faith community often don\'t know what to say — and what they say when they don\'t know what to say can land like devastation.\n\n"I\'m praying that God restores your marriage." Said with love. Felt like a refusal to accept where you are.\n\n"Have you tried counselling? There\'s still time." Said with hope. Felt like an implication that you haven\'t tried hard enough.\n\n"God hates divorce." Said with theological conviction. Felt like a verdict.\n\n"I don\'t want to take sides." Said to preserve a friendship. Felt like abandonment.\n\nThese things get said. And they hurt. And the hurt is valid even when the intention was good.' },
      { title:'What you are entitled to need', content:'You are entitled to need your community during this. You are not asking too much by wanting to be supported, not judged. You are not being unreasonable by wanting people to sit with you in the grief rather than immediately trying to fix it or theologically frame it.\n\nThe pastoral tradition holds that the primary role of the community in times of loss is presence. Not answers. Not correction. Not theological instruction. Presence.\n\nMany communities do this badly with divorce. That is a failure of pastoral formation, not a reflection of your worth or your right to support.' },
      { title:'The decision about your church', content:'One of the most difficult questions you may be facing is whether to stay at your current church or find a new one.\n\nReasons to stay: Continuity of community. Established relationships that have depth. The possibility that things improve over time. Not wanting to feel like the divorce has taken your church from you as well.\n\nReasons to leave: If your community has treated you with judgment rather than pastoral care. If the church is shared with your former spouse in a way that makes attendance practically impossible. If the pain of attending outweighs whatever you receive from it.\n\nA middle path: Some people take a temporary break — not to leave permanently, but to have space to breathe — while maintaining their faith privately or in smaller community. This is not abandonment of faith. It is pastoral self-care in an acute season.' },
      { title:'Shared community', content:'If you and your former spouse attend the same church, you are navigating something particularly complex.\n\nSome couples manage to remain in the same congregation with pastoral support and clear boundaries. Others find that it is not possible to be in the same space at the same time, at least for a season, and make an arrangement about which services or events each person attends. Others determine that one or both of them needs to find a different community.\n\nWhatever arrangement you reach, it works best when it is made explicitly — ideally with pastoral support — rather than left to an implicit, painful negotiation that plays out in the church car park.' },
      { title:'What you actually need', content:'Before deciding anything about your community, it is worth being clear about what you actually need from it.\n\nNot what you think you should need. What you actually need right now.\n\nSome people need to be surrounded by community — to have people physically present, to be prayed for, to be held in a web of relationship. Some people need distance — to have space from the communal context for a season so they can grieve privately. Some people need a smaller, more intimate expression of community — a small group, a prayer partner — rather than the full congregational experience.\n\nAll of these are legitimate. None of them is a failure of faith. Knowing what you need is the first step toward being able to ask for it.' },
    ],
    promptId:'3.1', promptText:'What do you need from your church community right now that you\'re not getting? And what do you wish they understood about what you\'re going through that they don\'t seem to understand?',
    promptGuidance:'You don\'t need a single neat answer. A list is fine. What would ideal support from your community look like? What has actually happened? Write the gap between the two.',
    companionTrigger:'What you\'ve described about your community — that sounds genuinely hard. I want to ask: is there one person in your church, even one, who has actually shown up for you in this? And if there isn\'t, what has that absence felt like?'
  },
  {
    num:9, phase:3, phaseTitle:'Phase 3 — Navigating',
    title:'Talking to Your Children About God and This Divorce',
    headline:'What you say, and how you say it, will shape what your children believe about God and about themselves.',
    purpose:'What children need to hear, what not to say, co-parenting across faith differences',
    sections:[
      { title:'The weight of this', content:'If you are a parent going through divorce, you are carrying something that non-parents in this track are not carrying: the awareness that your children are watching.\n\nThey are watching how you handle this. They are listening to what you say about God, about marriage, about their other parent, about what has happened to your family. And they are drawing conclusions — about faith, about love, about whether the world is safe — that will stay with them for a long time.\n\nThis is not meant to add to your burden. You are already doing an enormous amount. It is meant to take seriously what you already know: that what you say and how you say it matters.' },
      { title:'What children need to hear about God', content:'Children going through their parents\' divorce are asking their own versions of the questions you are asking. They may not articulate them in theological language, but the questions are there.\n\nIs God still in charge? Did God make this happen? Is this a punishment? Does God still love our family?\n\nWhat children need to hear — in age-appropriate language — is something like this: God loves you. That has not changed and will not change. Our family is changing shape, but God\'s love for each of us is not changing. This is not a punishment. This is not what God wanted, but God is with us in it, and God will be with us through it.\n\nThis does not require you to lie about the pain, the loss, or the difficulty. But they need a theological anchor — something to hold onto about God and about themselves — and you are the one best placed to give it to them.' },
      { title:'What not to say', content:'Don\'t use faith as a weapon. "God is angry at your father/mother because of what they did" is not a theological statement — it is a way of recruiting God into your pain, and it will damage your child\'s faith and their relationship with their other parent.\n\nDon\'t promise things you can\'t promise. "God will bring us back together" or "God will fix this" are promises that may not be kept, and children who pray for those things and don\'t see them happen can conclude that God doesn\'t listen.\n\nDon\'t require your children to take a theological position on the divorce. They are children. They are not equipped to adjudicate between the two adults they love most. Their job is to be children.' },
      { title:'Co-parenting across faith differences', content:'If you and your former spouse have different levels of faith commitment, or belong to different faith traditions, the question of how to raise your children in faith becomes more complicated.\n\nDon\'t use faith as a differentiator that demeans the other parent. Positioning faith as a loyalty marker forces children to choose between parents in a way that is damaging.\n\nDo maintain your own practice consistently. Children who see a parent living a faith life receive that by observation, not by instruction. Live it and let them see it.\n\nDo make space for your children\'s questions. Answer honestly and non-judgmentally: "Different people believe different things. I believe X, and I try to live by it."' },
      { title:'Looking after yourself to look after them', content:'One of the most important things you can do for your children spiritually is to look after your own spiritual life.\n\nChildren read their parents. If you are in spiritual crisis — if your own faith is shaken, your prayer life has collapsed, your relationship with your community is ruptured — your children will sense that, even if they don\'t have words for it.\n\nThis is not an argument for performing a faith you don\'t currently feel. It is an argument for doing your own work — including this track — so that you have something real to offer them. You cannot give what you do not have. Coming back to your own faith in this season is not just for you. It is also for them.' },
    ],
    promptId:'3.3', promptText:'What do you most want your children to know about God and about your family, coming out of this? And what are you afraid they might conclude about faith because of what they\'re watching?',
    promptGuidance:'Write honestly about both the hope and the fear. You don\'t have to have it all figured out. The act of naming what you want for your children in this area is itself a form of pastoral care for them.',
    companionTrigger:'What you\'ve written about your children — I can feel how much you\'re holding for them on top of everything you\'re holding for yourself. How are they doing, from what you can see? And how are you doing in the role of being the one who has to hold it together for them?'
  },
  {
    num:10, phase:3, phaseTitle:'Phase 3 — Navigating',
    title:'The New Shape of Your Spiritual Life',
    headline:'Your spiritual life doesn\'t have to look like it did before. It just has to be yours.',
    purpose:'Rebuilding prayer, Scripture, and community — start with one thing',
    sections:[
      { title:'What has changed', content:'The spiritual life you had before the divorce was probably built around structures that no longer fully exist.\n\nA shared prayer rhythm with your spouse. A church community that felt uncomplicated. A pattern of service or ministry that was connected to your identity as a couple or a family. A sense of yourself as someone with a settled faith life.\n\nSome or all of those structures have been disrupted. And the disruption can make the spiritual life feel impossible — not because faith is gone, but because the scaffolding it rested on has changed shape.\n\nThis module is about rebuilding that scaffolding. Not restoring what was — that is not always possible — but building something new that holds what you actually have now.' },
      { title:'Starting small', content:'When the spiritual life has been disrupted, the instinct is sometimes to try to restore everything at once. This rarely works, and it often produces guilt when it fails.\n\nA better approach is to start with one thing.\n\nOne prayer practice. One regular point of contact with Scripture. One community connection. One act of service. One spiritual friendship.\n\nNot all of them. One.\n\nThe spiritual life, like the rest of life, is rebuilt incrementally. The goal in this season is not to arrive back at where you were — it is to find something that is genuinely alive for you right now, however small, and to tend it.' },
      { title:'Prayer after disruption', content:'If your prayer life has been disrupted — and for most people going through divorce, it has been — it helps to know that there are ways back in that don\'t require you to be where you were before you can start.\n\nBrief, honest prayer is more sustainable than lengthy, structured prayer in a season of grief. "God, I don\'t know where you are and I\'m barely holding on" is a complete and valid prayer.\n\nThe Psalms as a prayer book are available precisely for seasons like this. Praying a single Psalm — reading it slowly, letting its words be yours — is a practice that requires very little capacity and offers a great deal.\n\nExtemporaneous honesty — simply talking to God in your own words, about exactly what is happening, without theological tidying — is often more alive than any structured form. Let it be a conversation, not a report.' },
      { title:'Scripture after disruption', content:'If Scripture has felt flat or distant or even painful since the divorce — particularly if it has been used against you — there are ways of re-engaging it that don\'t require you to encounter the passages that hurt first.\n\nStart with the Psalms of lament. They meet you where you are.\n\nTry the Gospels — specifically the stories of Jesus engaging people whose lives have not gone as expected. The woman at the well. Zacchaeus. The prodigal son\'s father. These are stories of encounter, not judgment.\n\nDon\'t force it. A single verse that genuinely reaches you is worth more than a chapter that sits inert.' },
      { title:'Community in a new shape', content:'Your faith community may now look different than it did. That is okay.\n\nFor some people, rebuilding community means re-engaging a primary congregation from which they have been somewhat absent. For others, it means finding a new community that doesn\'t carry the weight of the previous marriage. For others, it means building something smaller — a prayer partnership, a small group, a spiritual direction relationship — rather than full congregational participation.\n\nAll of these are legitimate expressions of Christian community. The New Testament\'s vision is not one-size-fits-all — it includes everything from the large gathered assembly to two or three meeting in Jesus\' name.\n\nFind the shape that you can actually sustain right now. It does not need to be the largest or the most impressive version of community. It needs to be real.' },
    ],
    promptId:'3.4', promptText:'What one faith practice do you want to hold onto through this season? What one do you want to build or rebuild? And: what has fallen away that you grieve losing?',
    promptGuidance:'You don\'t have to rebuild everything at once. Name one thing to hold and one thing to build. The grief for what has fallen away is allowed — let yourself feel it before you move to the rebuilding.',
    companionTrigger:'The practice you want to hold onto — what is it about that one specifically that matters to you? And the one you want to build: is it something completely new, or something that used to be there that you want to find again?'
  },
  {
    num:11, phase:4, phaseTitle:'Phase 4 — Rebuilding',
    title:'Forgiveness — The Long Work',
    headline:'You are not required to have forgiven yet. But you are invited to begin.',
    purpose:'What forgiveness is not, what it is, self-forgiveness, the long work',
    sections:[
      { title:'What forgiveness is not', content:'Forgiveness is not the same as reconciliation. Reconciliation requires two people and the rebuilding of a relationship. Forgiveness is something one person can do alone. They are not the same thing.\n\nForgiveness is not the same as saying what happened was acceptable. It is not condoning. It is not forgetting. It is not pretending the harm was not harm.\n\nForgiveness is not a single moment. It is, for most people, a long process — sometimes years — that involves return and revision and sometimes beginning again from the start when the wound reopens.\n\nForgiveness is not something you owe on a timeline set by other people. Well-meaning Christians sometimes exert enormous pressure on people in your situation to forgive quickly. That pressure is pastorally damaging. Forgiveness is not something that can be rushed into genuine existence by willpower or social expectation.' },
      { title:'What forgiveness is', content:'At its core, forgiveness is the decision — made and remade — to release a debt.\n\nThe New Testament word for forgiveness literally means to release, to send away. Forgiveness is the act of releasing the debt of what was done to you — not because the debt wasn\'t real, not because you weren\'t harmed, but because carrying the debt is costing you more than releasing it.\n\nThis is not primarily about the other person. Forgiveness does not require their repentance. It does not require their acknowledgment of what they did. It does not require any change in them at all. It is something you do for your own freedom, not for their benefit.\n\nThat reframe — from forgiveness as a gift to the other person to forgiveness as a release for yourself — is often what makes it possible to begin.' },
      { title:'The theology of forgiveness', content:'The Christian theology of forgiveness is one of the richest and most demanding in the tradition.\n\nJesus told Peter to forgive not seven times but seventy times seven — an expression of limitlessness, not a literal instruction. The parable of the unforgiving servant makes the connection between receiving forgiveness and offering it as explicit as it can be made.\n\nAt the same time, the tradition does not require instantaneous or complete forgiveness in the face of serious harm. The Psalms include imprecatory prayers — prayers for justice, for vindication, for God to act against those who have done wrong. The path through the tradition is not to suppress the anger in order to get to forgiveness faster. It is to let the anger be fully felt and named — including before God — and to allow forgiveness to emerge from that honest process.' },
      { title:'Forgiving yourself', content:'For many people, forgiving themselves is harder than forgiving their former spouse.\n\nThe internal voice is relentless. I should have tried harder. I should have seen this coming. I should have been a better spouse, a better parent, a better Christian. I failed. And unlike with another person, you cannot get distance from yourself. The prosecuting voice is always there.\n\nSelf-forgiveness begins with honest acknowledgment of what you actually did wrong — not a global condemnation of yourself as a person, but the specific things you genuinely regret. It continues with bringing those specific things before God in confession and receiving the promise of forgiveness that the tradition consistently offers.\n\n"There is now no condemnation for those who are in Christ Jesus." (Romans 8:1) That promise is not addressed to people who have never failed. It is addressed to human beings. It is addressed to you.' },
      { title:'The long work', content:'Forgiveness is called a long work because that is what it is. There is no version of serious forgiveness — for serious harm — that is quick.\n\nWhat there is, is beginning. And return. And the recognition that forgiveness is not a single decision but a practice — something you come back to, something you choose again when the wound reopens, something that gradually becomes less effortful and more free as the years pass.\n\nYou are not required to be further along than you are. You are not required to have forgiven before you are ready. What you are invited to do is begin — which may mean nothing more than being willing to begin, holding the intention without yet having the capacity, and bringing even that willingness honestly before God.\n\nThat is enough for today.' },
    ],
    promptId:'4.1', promptText:'What does forgiveness feel like it would need to include, for you, to be real rather than performed? What are you not yet ready to forgive — and what would you need before you could? And: is there something in this that you have not yet forgiven yourself for?',
    promptGuidance:'Write where you actually are, not where you think you should be. Honest not-yet-readiness is more valuable than performed readiness. And the gap between what you believe about forgiveness in general and what you can extend to yourself is worth naming honestly.',
    companionTrigger:'What you\'ve written — I\'m not going to push you anywhere you\'re not ready to go. I just want to ask: when you imagine reaching the other side of this — when you imagine having genuinely forgiven — what does your life feel like in that place? What becomes possible?'
  },
  {
    num:12, phase:4, phaseTitle:'Phase 4 — Rebuilding',
    title:'A New Story',
    headline:'This is not the end of your story. It is a chapter — a hard one — inside a larger one.',
    purpose:'Biblical tradition of rupture and renewal, identity after the track, going forward',
    sections:[
      { title:'What you have done', content:'You made it to the end of this track.\n\nTake a moment with that. Not because the track is a great achievement — but because arriving here means you stayed. You kept showing up. You read the modules, you wrote in the journal, you let yourself be asked the questions that were hard to sit with. In the middle of one of the most difficult seasons of your life, you did that.\n\nThat is not nothing. That is, in fact, quite a lot.' },
      { title:'The biblical tradition of rupture and renewal', content:'The Christian Scriptures are full of people whose stories broke in the middle and then continued.\n\nJacob, who wrestled with God through the night and emerged with a limp and a new name. David, whose failures — including catastrophic moral failures — are recorded in detail in Scripture, and who is still described as a man after God\'s own heart. Paul, whose entire life was restructured by an encounter he did not choose. Peter, who denied Jesus three times and became the foundation of the church.\n\nThese are not stories of people who avoided rupture. They are stories of people whose ruptures became part of the story God was telling through them — not erased, not minimised, but transformed into something that, over time, bore meaning.\n\nYour story is not over. The rupture is real. The grief is real. The loss is real. And the story is still being written.' },
      { title:'What has shifted', content:'Look back at where you were when you began this track — at what you wrote in your first journal entry, at the weight you were carrying, at the questions that felt most urgent and most unanswerable.\n\nSome of that weight may be lighter now. Some of those questions may have more texture around them, more nuance, more room to breathe — even if they are not resolved. Some things that felt like shameful secrets may have been named and found to be less singular than they seemed.\n\nAnd some things may still be as heavy as they were. That is also allowed. The track is not a cure. It is a companionship. And the work continues beyond these twelve modules.\n\nBut something has shifted. It always does, when we stay with hard things honestly and don\'t look away.' },
      { title:'Who you are in this new chapter', content:'You are not who you were when this began. You have been through something that changes people.\n\nIn the Christian tradition, the language of transformation is not incidental — it is central. "We are being transformed into his image." (2 Corinthians 3:18) The verb is present continuous. It is always happening. And it often happens precisely in the places of rupture, not in the places of ease.\n\nYou do not have to have a triumphant narrative about what this season has given you. It is too early for that, and the attempt to produce one before it is true is a form of spiritual bypassing that does not serve you.\n\nWhat you can hold, honestly, is the possibility that the person emerging from this season — having been through it, having stayed in it, having asked the questions and sat with the lament and kept reaching toward God — is someone with a depth and a tested faith that they did not have before.' },
      { title:'Going forward', content:'You are going to keep living. And in that living, you will continue to encounter the questions this track raised — about God, about identity, about community, about forgiveness, about the future.\n\nThe companion is still here. The journal is still here. The modules are still available to return to.\n\nIf this track has raised questions that need to be worked through with a pastor or spiritual director — and it probably has — now is a good time to make that appointment. Not because you are in crisis, but because you are ready. You have language now. You have clarity about what you are carrying.\n\nAnd whatever comes next, you are not doing it alone.\n\n"And surely I am with you always, to the very end of the age." (Matthew 28:20)\n\nThat promise is for you. It was for you at the beginning of this track. It is for you now.' },

    sections:[
      { title:'Roman Catholic', content:'The foundational principle: Marriage between two baptised Christians is a sacrament, and a valid sacramental marriage is indissoluble. It cannot be ended by any human authority, including civil divorce.\n\nCivil divorce: May be obtained for legitimate practical reasons — financial protection, legal custody, personal safety — without spiritual condemnation. A civilly divorced Catholic remains fully Catholic and may receive the sacraments, unless they have entered a new civil marriage without a declaration of nullity.\n\nThe annulment process: An annulment (Declaration of Nullity) is a formal declaration that a valid sacramental marriage never actually existed — because one or more essential elements required for a valid marriage were absent. The process is conducted through a diocesan marriage tribunal.\n\nRemarriage: A Catholic whose previous marriage has been declared null may remarry in the Church. This is one of the most pastorally painful aspects of Catholic practice, subject to ongoing theological discussion, particularly following Pope Francis\'s Amoris Laetitia (2016).\n\nPastoral note: The Church does not regard divorced Catholics as excommunicated, unwelcome, or beyond grace. Many dioceses offer dedicated ministries for divorced and separated people.' },
      { title:'Anglican / Episcopal', content:'The foundational principle: Marriage is a serious, lifelong covenant entered before God. Divorce is always a pastoral tragedy. At the same time, the Anglican tradition has developed a pastoral theology that allows for both divorce and remarriage under certain conditions.\n\nCurrent position: The Church of England permits clergy to conduct marriages of divorced people at their discretion. In South Africa, the Anglican Church of Southern Africa permits remarriage after divorce with appropriate pastoral process.\n\nVariation: Anglican practice varies significantly by province, diocese, and individual congregation. The tradition\'s emphasis on pastoral flexibility means that individual experiences of support vary considerably.' },

      { title:'Reformed / Presbyterian', content:'The foundational principle: The Reformed tradition holds a high view of marriage as a covenant reflecting the covenant between Christ and the Church.\n\nThe Westminster Confession position (1646): Divorce is permitted on grounds of adultery and "wilful desertion as can no way be remedied by the church or civil magistrate." This is the formal position of most confessionally Reformed churches.\n\nRemarriage: The Westminster Confession permits remarriage for the innocent party. The guilty party\'s eligibility for remarriage is a matter of greater pastoral debate within the tradition.' },
      { title:'Methodist', content:'The foundational principle: The Methodist tradition follows the Wesleyan heritage of grace — a strong emphasis on prevenient grace, justifying grace, and sanctifying grace. This framework shapes the tradition\'s pastoral approach to divorce.\n\nDivorce and remarriage: The Methodist church permits divorce and does not hold a formal restrictive position on the grounds required. Methodist churches generally permit remarriage, subject to pastoral discernment.\n\nPastoral note: The Methodist emphasis on grace and community typically produces a pastoral culture that is welcoming to divorced people. The tradition\'s historic commitment to care for the vulnerable often translates into particular sensitivity.' },

      { title:'How is spiritual direction different from therapy?', content:'Therapy is primarily focused on psychological wellbeing — on healing wounds, changing patterns of thought and behaviour. A therapist works from a clinical framework and does not require or assume faith.\n\nSpiritual direction is primarily focused on your relationship with God — on attending to the movements of God in your life. A spiritual director works from a faith framework and engages the spiritual dimension of your experience directly.\n\nThey are different tools for different purposes. Many people in significant life transitions benefit from both simultaneously. They are not in competition.\n\nIf you are in significant emotional distress — struggling with depression, anxiety, trauma, or acute grief — therapy with a qualified mental health professional is not a luxury. It is appropriate and important care. The pastoral and the psychological can happen in parallel.' },
