function rJournalReflect(w) {
  const msgs=S.jConvs.map(m=>
    m.role==='assistant'
      ?`<div class="bubble-row fade-in"><div class="av-dot"><div class="av-inner"></div></div><div class="bubble-c">${m.content}</div></div>`
      :`<div class="bubble-row fade-in" style="justify-content:flex-end"><div class="bubble-u">${m.content}</div></div>`
  ).join('');
  const typ=S.jIsTyping?`<div class="bubble-row fade-in"><div class="av-dot"><div class="av-inner"></div></div><div class="typing-wrap"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>`:'';

  w.innerHTML=`
    <div class="status-bar status-light"><span>9:41</span><span>●●●</span></div>
    <div style="padding:10px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid var(--stone);background:var(--linen);flex-shrink:0">
      <div id="bk-j" style="font-size:20px;color:var(--dusk);cursor:pointer;padding:2px 6px;line-height:1">‹</div>
      <div class="av-dot" style="background:var(--dark2);border-color:var(--terra)"><div class="av-inner"></div></div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;color:var(--text)">Reflecting on your entry</div>
        <div class="t-label t-muted" style="font-size:9px">your companion is here</div>
      </div>
    </div>
    <div style="background:var(--linen);border-bottom:0.5px solid var(--stone);padding:12px 16px;flex-shrink:0">
      <div class="t-label t-muted" style="margin-bottom:5px">${S.jPrompt?'Prompt: '+S.jPrompt:'Your entry'}</div>
      <div style="font-family:var(--serif);font-size:13px;color:var(--text);font-style:italic;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${S.jText}</div>
    </div>
    <div id="j-thread" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--dark)">
      ${msgs}${typ}
    </div>
    <div style="padding:8px 12px 16px;border-top:0.5px solid var(--dark2);background:var(--dark);flex-shrink:0">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="jri" class="input input-dark" placeholder="Reply to your companion…" style="flex:1;border-radius:20px;resize:none;min-height:40px;padding:10px 14px;line-height:1.4" rows="1"></textarea>
        <button id="jr-send" style="width:38px;height:38px;border-radius:50%;background:var(--terra);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 2L8 14L7 9L2 8Z" fill="#2D2420"/></svg>
        </button>
      </div>
    </div>`;
  setTimeout(()=>{
    const thread=w.querySelector('#j-thread'); thread.scrollTop=thread.scrollHeight;
    on(w,'#bk-j','click',()=>{S.jPhase='write';S.jText='';S.jPrompt='';S.jConvs=[];R();});
    const inp=w.querySelector('#jri');
    const send=async()=>{
      const t=inp.value.trim(); if(!t||S.jIsTyping)return;
      inp.value=''; inp.style.height='auto';
      S.jConvs.push({role:'user',content:t});
      S.jIsTyping=true; R();
      try{
        // Build context: entry as first user message, then the conversation so far
        const msgs=[
          {role:'user',content:S.jText},
          ...S.jConvs.slice(0,-1).map(m=>({role:m.role,content:m.content})),
          {role:'user',content:t}
        ];
        const reply=await ai(msgs,SYS_JOURNAL_REFLECT(S.jPrompt,S.jText));
        S.jConvs.push({role:'assistant',content:reply});
      }catch(e){
        S.jConvs.push({role:'assistant',content:"I'm having trouble connecting right now. Please try again in a moment."});
      }
      S.jIsTyping=false; R();
    };
    on(w,'#jr-send','click',send);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
    inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});
  },0);
  return w;
}

function rFaithHome() {
  const w = el('div','screen linen-bg');
  const done = S.faith.modulesCompleted;
  const pct = Math.round((done.length/total)*100);
  const visibleModules = FAITH_MODULES.filter(m=> m.num!==9 || S.faith.hasChildren!==false);

  w.innerHTML=`
    <div class="status-bar" style="background:var(--amber-light)"><span style="font-size:11px;color:var(--amber-dark)">9:41</span><span style="font-size:11px;color:var(--amber)">●●●</span></div>

        </div>
        <div id="faith-companion-btn" style="background:var(--amber);border-radius:99px;padding:5px 12px;font-size:11px;font-weight:500;color:#fff;cursor:pointer">Talk</div>
        <div id="faith-settings-home-btn" style="width:28px;height:28px;border-radius:50%;background:var(--amber-light);border:0.5px solid var(--amber-border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" title="Privacy settings">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="2" stroke="var(--amber-dark)" stroke-width="1.2"/><circle cx="6.5" cy="6.5" r="5.5" stroke="var(--amber-dark)" stroke-width="1"/></svg>
        </div>
      </div>
      <div class="faith-progress" style="margin-bottom:6px"><div class="faith-progress-fill" style="width:${pct}%"></div></div>

        <span>${done.length} of ${total} modules</span>
        <span>${faithPhases.find(p=>p.modules.includes(nextM.num))?.title||''}</span>
      </div>
    </div>
    <div class="scroll-content" style="padding:14px;display:flex;flex-direction:column">
      ${faithPhases.map(phase=>`
        <div class="phase-hdr">${phase.title}</div>
        ${FAITH_MODULES.filter(m=>m.phase===phase.num).map(m=>{
          // Module 9 (children) — only show if user has children
          if(m.num===9 && S.faith.hasChildren===false) return '';
          const isDone=done.includes(m.num);
          const isNext=m.num===nextM.num&&!isDone;
          const isLocked=!isDone&&m.num>(done.length?Math.max(...done)+1:1)&&!isNext;
          return `<div class="module-row ${isDone?'module-done':''} ${isLocked?'module-locked':''}" data-mnum="${m.num}">

            <div style="flex:1">
              <div style="font-size:13px;font-weight:${isNext?'500':'400'};color:${isLocked?'var(--stone)':isNext?'var(--amber-dark)':'var(--text)'}">${m.title}</div>

            </div>
            ${isNext?`<div style="font-size:10px;font-weight:500;color:var(--amber);background:var(--amber-light);padding:3px 8px;border-radius:99px;border:0.5px solid var(--amber-border)">Next</div>`:''}

  on(w,'#faith-settings-home-btn','click',()=>{ S.screen='faithSettings'; R(); });

    if(!S.faith.companionConvs.length){

      if(isLocked) return;
      S.faith.currentModule=num;
      S.screen='faithModule'; R();
    });
  });
  return w;

// ── FAITH MODULE READING ──────────────────────────────────────
// ══════════════════════════════════════════════════════════════
function rFaithModule() {
  const mod = getFaithModule(S.faith.currentModule);
  const isDone = S.faith.modulesCompleted.includes(mod.num);
  const w = el('div','screen linen-bg');

  const sectionsHtml = mod.sections.map((s,i)=>{
    // Format content: handle newlines, scripture quotes (lines starting with ")
    const formatted = s.content.split('\n\n').map(para=>{
      if(!para.trim()) return '';
      // Scripture block: paragraph containing em-dash attribution or starts with quote mark
      if((para.includes('\u2014') || para.match(/^[\u201C"]/)) && para.length < 400){
        const lines = para.split('\n').map(l=>l.trim()).filter(Boolean);
        return '<div class="scripture-block">' + lines.map(l=>`<div style="margin-bottom:4px">${l}</div>`).join('') + '</div>';
      }
      return `<p style="margin-bottom:12px;font-size:14px;line-height:1.8;color:var(--text);font-weight:300">${para.trim()}</p>`;
    }).join('');
    return `<div class="reading-section">
      <div class="section-title">${s.title}</div>
      <div class="section-content">${formatted}</div>
    </div>`;
  }).join('');

  w.innerHTML=`
    <div class="status-bar" style="background:var(--amber-light)"><span style="font-size:11px;color:var(--amber-dark)">9:41</span><span style="font-size:11px;color:var(--amber)">●●●</span></div>
    <div style="background:var(--amber-light);padding:10px 16px 14px;border-bottom:0.5px solid var(--amber-border);flex-shrink:0;display:flex;align-items:center;gap:10px">
      <div id="bk-module" style="font-size:20px;color:var(--amber-dark);cursor:pointer;padding:2px 4px;line-height:1">‹</div>
      <div style="flex:1">
        <div class="t-label" style="color:var(--amber);margin-bottom:2px">${mod.phaseTitle} · Module ${mod.num}</div>
        <div style="font-family:var(--serif);font-size:16px;color:var(--amber-dark);line-height:1.3">${mod.title}</div>
      </div>
    </div>
    <div class="scroll-content" style="padding:20px 20px 0">
      <div style="font-family:var(--serif);font-size:13px;color:var(--amber);font-style:italic;margin-bottom:20px;line-height:1.6">${mod.headline||''}</div>
      ${sectionsHtml}
      <div style="background:var(--amber-light);border-radius:var(--r-lg);border:0.5px solid var(--amber-border);padding:16px;margin-bottom:16px">
        <div class="t-label" style="color:var(--amber);margin-bottom:8px">Journal prompt</div>
        <div style="font-family:var(--serif);font-size:15px;color:var(--amber-dark);line-height:1.6;font-style:italic;margin-bottom:10px">"${mod.promptText}"</div>
        <div style="font-size:12px;color:var(--dusk);line-height:1.6;margin-bottom:12px">${mod.promptGuidance}</div>
        <button id="go-journal" class="btn btn-faith btn-sm">Open journal for this prompt</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button id="go-companion" class="btn btn-faith-ghost btn-sm" style="flex:1;border-radius:10px">Talk to companion</button>
        ${!isDone?`<button id="mark-done" class="btn btn-faith btn-sm" style="flex:1;border-radius:10px">Mark complete</button>`:`<div style="flex:1;padding:9px;text-align:center;font-size:12px;color:var(--amber-dark);background:var(--amber-light);border-radius:10px;border:0.5px solid var(--amber-border)">✓ Completed</div>`}
      </div>
    </div>`;

  on(w,'#bk-module','click',()=>{ S.screen='faithHome'; R(); });
  on(w,'#go-journal','click',()=>{
    S.faith.jPromptId=mod.promptId; S.faith.jPromptText=mod.promptText;
    S.faith.jPhase='write'; S.faith.jText='';
    S.screen='faithJournal'; R();
  });
  on(w,'#go-companion','click',()=>{
    const trigger = mod.companionTrigger;
    if(!S.faith.companionConvs.length && trigger){
      S.faith.companionConvs=[{role:'assistant',content:trigger}];
    } else if(!S.faith.companionConvs.length){
      S.faith.companionConvs=[{role:'assistant',content:`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`}];
    }
    S.screen='faithCompanion'; R();
  });
  on(w,'#mark-done','click',async()=>{
    if(!S.faith.modulesCompleted.includes(mod.num)){
      S.faith.modulesCompleted=[...S.faith.modulesCompleted,mod.num];
      await saveFaithProgress({modules_completed:S.faith.modulesCompleted});
    }
    S.screen='faithHome'; R();
  });
  return w;
}

  w.querySelectorAll('[data-eid]').forEach(card=>{

}

function rFaithDeepDive() {
  const w = el('div','screen linen-bg');
  const dd = DEEP_DIVES[S.faith.currentDeepDive] || DEEP_DIVES[0];

  // Build sections HTML — handle scripture sections differently
  const sectionsHtml = dd.sections.map(s=>{
    if(s.isScripture && s.passages){
      const passagesHtml = s.passages.map(p=>`
        <div style="margin-bottom:16px">
          <div class="scripture-block">
            <div style="font-size:11px;font-weight:500;color:var(--amber-dark);letter-spacing:0.06em;margin-bottom:6px">${p.ref}</div>
            <div style="font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--amber-dark)">"${p.text}"</div>
          </div>
          <div style="font-size:13px;color:var(--dusk);line-height:1.6;padding:6px 0 0;font-weight:300">${p.note}</div>
        </div>`).join('');
      return `<div class="reading-section"><div class="section-title">${s.title}</div>${passagesHtml}</div>`;
    }
    // Regular text section
    const formatted = s.content.split('\n\n').map(para=>{
      if(!para.trim()) return '';
      return `<p style="margin-bottom:12px;font-size:14px;line-height:1.8;color:var(--text);font-weight:300">${para.trim()}</p>`;
    }).join('');
    return `<div class="reading-section"><div class="section-title">${s.title}</div>${formatted}</div>`;
  }).join('');

  // Intro paragraphs
  const introHtml = dd.intro.split('\n\n').map(p=>
    `<p style="font-size:14px;line-height:1.8;color:var(--text);font-weight:300;margin-bottom:12px">${p.trim()}</p>`
  ).join('');

  w.innerHTML=`
    <div class="status-bar" style="background:var(--amber-light)"><span style="font-size:11px;color:var(--amber-dark)">9:41</span><span style="font-size:11px;color:var(--amber)">●●●</span></div>

        <div class="t-label" style="color:var(--amber);margin-bottom:3px">Deep-Dive ${dd.letter}</div>
        <div style="font-family:var(--serif);font-size:17px;color:var(--amber-dark);line-height:1.3">${dd.title}</div>
        <div style="font-size:12px;color:var(--dusk);margin-top:3px">${dd.subtitle}</div>
      </div>
    </div>
    <div class="scroll-content" style="padding:20px 20px 0">
      <div style="margin-bottom:20px">${introHtml}</div>
      ${sectionsHtml}
      <div style="background:var(--amber-light);border-radius:var(--r-lg);border:0.5px solid var(--amber-border);padding:14px;margin-bottom:20px">
        <div style="font-size:13px;color:var(--amber-dark);line-height:1.6;margin-bottom:10px;font-family:var(--serif);font-style:italic">Your companion can engage with any of these questions in more depth.</div>
        <button id="dd-companion-btn" class="btn btn-faith btn-sm">Talk to companion about this</button>
      </div>
    </div>`;

  on(w,'#bk-dd','click',()=>{ S.screen='faithHome'; R(); });
  on(w,'#dd-companion-btn','click',()=>{
    const prompts = {
      'A': `I've just read about the different denominational positions on divorce. I have some questions about what my tradition believes.`,
      'B': `I'm thinking about finding a spiritual director or pastor to talk to. Can you help me think through that?`,
      'C': `I've been reading through the Scripture passages. One of them particularly stayed with me and I\'d like to explore it.`,
    };
    if(!S.faith.companionConvs.length){
      S.faith.companionConvs=[{role:'assistant',content:`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`}];
    }
    S.faith.companionConvs.push({role:'user',content:prompts[dd.id]||"I've been reading through the resources and have some questions."});
    S.faith.companionTyping=true;
    S.screen='faithCompanion'; R();
    ai(S.faith.companionConvs.map(m=>({role:m.role,content:m.content})),SYS_FAITH_COMPANION())
      .then(reply=>{S.faith.companionConvs.push({role:'assistant',content:reply});S.faith.companionTyping=false;R();})
      .catch(()=>{S.faith.companionConvs.push({role:'assistant',content:"I'm having trouble connecting right now. Please try again in a moment."});S.faith.companionTyping=false;R();});
  });
  return w;
}

        ${S.faith.err?`<div class="err" style="margin-top:10px">${S.faith.err}</div>`:''}
        ${S.faith.settingsSaved?`<div class="ok" style="margin-top:10px;background:rgba(76,175,80,0.12);border:0.5px solid rgba(76,175,80,0.4);border-radius:var(--r-md);padding:8px 12px;font-size:12px;color:#2e7d32">Settings saved.</div>`:''}
      </div>

      <!-- Children setting -->
      <div style="background:#fff;border-radius:var(--r-lg);border:0.5px solid var(--stone);padding:16px">
        <div class="t-label t-muted" style="margin-bottom:12px">Your situation</div>
        <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px">Do you have children?</div>
        <div style="font-size:12px;color:var(--dusk);line-height:1.5;margin-bottom:12px">Module 9 — talking to your children about God and this divorce — is only shown to parents.</div>
        <div style="display:flex;gap:8px">
          <div class="option option-light ${hc===true?'sel':''}" id="ch-yes" style="flex:1;justify-content:center"><div class="opt-circle opt-circle-light ${hc===true?'sel':''}"></div>Yes</div>
          <div class="option option-light ${hc===false?'sel':''}" id="ch-no" style="flex:1;justify-content:center"><div class="opt-circle opt-circle-light ${hc===false?'sel':''}"></div>No</div>
        </div>
      </div>

      <!-- Journal deletion -->
      <div style="background:#fff;border-radius:var(--r-lg);border:0.5px solid var(--stone);padding:16px">
        <div class="t-label t-muted" style="margin-bottom:8px">Your journal entries</div>
        <div style="font-size:13px;color:var(--dusk);line-height:1.6;margin-bottom:12px">You can delete your Faith & Divorce journal entries at any time. This removes them from your companion's context within 24 hours. Your account and track progress are not affected.</div>
        <button id="delete-journal-btn" class="btn" style="background:#fff;border:0.5px solid #e74c3c;color:#e74c3c;font-size:13px">Delete all Faith & Divorce journal entries</button>
      </div>

      <div style="height:8px"></div>
    </div>`;

  on(w,'#bk-fs','click',()=>{ S.faith.settingsSaved=false; S.screen='faithHome'; R(); });

  // Consent toggle
  on(w,'#consent-toggle','click',async()=>{
    S.faith.journalConsent=!S.faith.journalConsent;
    const toggle=w.querySelector('#consent-toggle');
    toggle.classList.toggle('on',S.faith.journalConsent);
    await saveAndConfirm(w, {journal_consent:S.faith.journalConsent});
  });

  // Children toggle
  ['yes','no'].forEach(v=>{
    on(w,'#ch-'+v,'click',async()=>{
      S.faith.hasChildren=(v==='yes');
      w.querySelectorAll('#ch-yes,#ch-no').forEach(el=>{
        const isThis=el.id==='ch-'+v;
        el.classList.toggle('sel',isThis);
        el.querySelector('.opt-circle').classList.toggle('sel',isThis);
      });
      await saveAndConfirm(w, {has_children:S.faith.hasChildren});
    });
  });

  // Delete journal entries
  on(w,'#delete-journal-btn','click',async()=>{
    if(!confirm('Delete all your Faith & Divorce journal entries? This cannot be undone.')) return;
    S.faith.loading=true; S.faith.err=''; R();
    try{
      await sb.from('beside_faith_journal').delete().eq('user_id',S.userId);
      S.faith.jEntries=[]; S.faith.settingsSaved=true;
    }catch(e){ S.faith.err='Could not delete entries: '+e.message; }
    S.faith.loading=false; R();
  });

  return w;
}

async function saveAndConfirm(w, fields) {
  S.faith.err=''; S.faith.settingsSaved=false;
  try{
    await saveFaithProgress(fields);
    S.faith.settingsSaved=true;
    // Show saved confirmation briefly
    const savedEl=w.querySelector('.ok');
    if(savedEl){ savedEl.style.display='block'; setTimeout(()=>{ S.faith.settingsSaved=false; }, 2000); }
    else R(); // re-render to show saved message
  }catch(e){ S.faith.err='Could not save: '+e.message; R(); }
}
function rNav() {
  const nav = el('div','bottom-nav');
  const tabs=[['Home','home','M10 3L3 9v9h5v-5h4v5h5V9z'],['Companion','companion','M3 5a2 2 0 012-2h10a2 2 0 012 2v6a2 2 0 01-2 2H8l-4 3V5z'],['Journal','journal','M4 4a1 1 0 011-1h10a1 1 0 011 1v12l-4-2.5-4 2.5V4z'],['Tracks','tracks','M4 6h16M4 10h16M4 14h8'],['Profile','profile','M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z']];
  nav.innerHTML=tabs.map(([l,sc,p])=>{
    const a=S.screen===sc;
    return `<div class="nav-tab ${a?'active':''}" data-sc="${sc}">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="${p}" stroke="${a?'#2D2420':'#D9CFC8'}" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nav-tab-label">${l}</span>${a?'<div class="nav-dot"></div>':''}
    </div>`;
  }).join('');
  nav.querySelectorAll('[data-sc]').forEach(e=>e.addEventListener('click',async()=>{
    const sc=e.dataset.sc; S.screen=sc;
    if(sc==='companion'){S.convs=await loadConvs();if(!S.convs.length){const op=`Hi ${S.userName}. I'm glad you're here. How are you feeling right now?`;await saveMsg('assistant',op);S.convs=[{role:'assistant',content:op}];}}
    if(sc==='journal')await loadJData();
    if(sc==='home')await loadHomeData();
    if(sc==='tracks'){}
    if(sc==='faithJournal'){S.faith.jEntries=await loadFaithJournals();S.faith.jPhase='write';}
    if(sc==='faithCompanion'){S.faith.jEntries=await loadFaithJournals();if(!S.faith.companionConvs.length){const op=`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`;S.faith.companionConvs=[{role:'assistant',content:op}];}}
    R();
  }));
  return nav;
}

// ── Utils ──────────────────────────────────────────────────────
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function on(w,sel,ev,fn){w.querySelector(sel)?.addEventListener(ev,fn);}
function val(id){return document.getElementById(id)?.value||'';}
function opts(w,sel,selCls,circSel,circCls,setter,multi){
  w.querySelectorAll(sel).forEach(e=>e.addEventListener('click',()=>{
    const v=e.dataset.v;
    if(!multi){w.querySelectorAll(sel).forEach(x=>{x.classList.remove(selCls);x.querySelector('.'+circSel)?.classList.remove(circCls);});}
    const isSel=e.classList.contains(selCls);
    if(multi){e.classList.toggle(selCls,!isSel);e.querySelector('.'+circSel)?.classList.toggle(circCls,!isSel);}
    else{e.classList.add(selCls);e.querySelector('.'+circSel)?.classList.add(circCls);}
    setter(v);
  }));
}
function cpPrompt(){const p=['How are you actually feeling today?','What\'s been sitting with you this week?','Tell me about one small thing that felt okay recently.','How are the children doing? And underneath that — how are you?','What does your day look like, and how are you feeling going into it?'];return p[Math.floor(Math.random()*p.length)];}
function wkTheme(d){const t=['Week 1 · Grounding','Week 2 · Grief','Week 3 · Children','Week 4 · Identity','Week 5 · Routine','Week 6 · Social life','Week 7 · Finances','Week 8 · Self-worth','Week 9 · New chapter','Week 10 · Looking forward'];return t[Math.min(Math.floor((d-1)/7),t.length-1)];}
function wkEx(d){const e=['What does safety feel like for you right now?','Letting yourself grieve what you lost.','How to talk to your children with honesty.','Who are you outside this marriage?','Building routines that belong to you.','The friendships worth keeping.','Your financial ground truth.','What you\'ve learned about yourself.','Imagining your next chapter.','The person you\'re becoming.'];return e[Math.min(Math.floor((d-1)/7),e.length-1)];}
function milestone(d){if(d<7)return'First week complete';if(d<30)return'One month beside yourself';if(d<60)return'Two months of showing up';return'90-day track complete';}
function mDays(d){if(d<7)return 7-d;if(d<30)return 30-d;if(d<60)return 60-d;return Math.max(90-d,0);}

// ── Boot ───────────────────────────────────────────────────────
async function boot() {
  const u=LS.get('url'),k=LS.get('key'),a=LS.get('akey');
  if(!u||!k||!a){S.screen='setup';R();return;}
  S.sbUrl=u;S.sbKey=k;S.anKey=a;S.loading=true;R();
  try{
    await initSB(u,k);
    const {data:{session}}=await sb.auth.getSession();
    if(session) await handleSession(session); else S.screen='auth';
  }catch(e){
    // Don't wipe credentials on error — show auth screen with a notice
    S.screen='auth';
    S.err='Could not connect to Supabase: '+e.message+'. Check your credentials in settings.';
  }
  S.loading=false;R();
}
boot();
