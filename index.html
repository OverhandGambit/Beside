{day:13,week:2,
reading:"Divorce changes your social world. Friends take sides, sometimes without meaning to. Some disappear. Some get closer. It's a kind of social grief that runs underneath the primary grief — the loss of 'our friends,' shared dinners, the life you built together.",
journal:"How has your social world changed since the separation? Who has stayed? Who has gone? Who has surprised you?",
reflection:"What kind of social support do you most need right now that you're not getting?",
action:"Reach out to one friendship you value but have let drift. Just check in. It doesn't have to be about the divorce.",
gratitude:"Name one friendship you're genuinely grateful for right now."},
{day:14,week:2,
reading:"Two weeks. You are still here. The pain hasn't passed — but you are carrying it. That's different from being crushed by it. The distance between being in pain and being destroyed by pain is survivability. You are surviving.",
journal:"Two weeks in. What have you survived so far that you weren't sure you could?",
reflection:"What is the difference between surviving and thriving — and where are you on that line right now?",
action:"Look back at your day one entry. What has changed in two weeks, even a little?",
gratitude:"What do you have right now that you didn't have yesterday?"},
// ── Week 3 — One Day at a Time ───────────────────────────────
{day:15,week:3,
reading:"The future is impossible to see right now, and that's okay. You don't need to see it. The only horizon that matters is today. Just today. What needs to happen today — not the month, not the year, just today.",
journal:"When you think about the future, what do you feel? Fear, relief, blankness, hope — or something else?",
reflection:"What do you need to stop thinking about for now, because it belongs to a future you can't see yet?",
action:"Write a list of just today's priorities. Not the week's. Not the month's. Just today's. Then do the first thing on it.",
gratitude:"What is good about today, specifically — even if it's very small?"},
{day:16,week:3,
reading:"Money and divorce are complicated. Legal fees, changing income, new housing costs. Financial anxiety is one of the most common and least talked about parts of this. Whatever your situation, the fear deserves to be named rather than pushed down.",
journal:"What's your biggest financial worry right now? Write it out plainly — what is the actual fear underneath it?",
reflection:"What would 'financially stable enough' look like for you in a year?",
action:"Do one small financial task today: look at a bank statement, make a call, find one piece of information. Just one.",
gratitude:"What do you have financially that you're grateful for, however modest?"},
{day:17,week:3,
reading:"Identity. Who are you now that the marriage is over? The question feels too big to answer, but it's already being answered every day — by the choices you make, the person you're showing up as, the things you're finding you care about.",
journal:"What have you discovered about yourself since the separation that surprised you — something you didn't know or had forgotten?",
reflection:"What aspects of yourself do you feel most uncertain about right now?",
action:"Do one thing today that is purely an expression of who you are — not who you were in the marriage, not who you think you should be.",
gratitude:"What is something about yourself you're genuinely glad to have?"},
{day:18,week:3,
reading:"Rest is not laziness. In acute grief and upheaval, rest is recovery work. The pressure to be productive, to be seen to be managing — that pressure can make you ignore what your body and mind actually need. Today: permission to rest.",
journal:"When did you last genuinely rest? What does rest look like for you — and are you getting enough of it?",
reflection:"What gets in the way of allowing yourself to rest?",
action:"Build one hour of rest into today. Not passive scrolling — real rest. A bath, sleep, sitting in silence, walking slowly.",
gratitude:"What feels restorative to you right now? Name even one thing."},
{day:19,week:3,
reading:"Resentment builds when we don't acknowledge hurt. It accumulates slowly, makes us harder, less available to our own lives. This isn't about forgiving your ex — that comes later. This is just about not letting the resentment become the primary thing.",
journal:"What are you holding onto that is costing you energy — resentment, unfinished business, a conversation that never happened?",
reflection:"What would it mean to put that thing down — not forgive it, just not carry it so tightly?",
action:"Write a letter you'll never send. Say what you need to say. Then put it away.",
gratitude:"What have you let go of since this began that you're relieved to no longer be carrying?"},
{day:20,week:3,
reading:"You're three weeks in. The acute crisis phase is beginning to stabilise, even if it doesn't feel like it. The chaos doesn't go away — but something underneath it begins, slowly, to settle. You may not feel it yet. But the stabilisation is happening.",
journal:"What feels slightly more settled than it did three weeks ago, even if it's only one small thing?",
reflection:"What is the most important thing you've learned about what you actually need?",
action:"Write down three things that have helped in these three weeks — even small things. Keep that list somewhere you can find it.",
gratitude:"What has this difficult period revealed about your own strength?"},
{day:21,week:3,
reading:"Three weeks. You've survived the very hardest part — not because it's over, but because you've proven to yourself that you can. The next phase is different: less about getting through, more about finding ground. That starts now.",
journal:"Three weeks in — what has changed in you, even a little, since day one?",
reflection:"What do you want the next three weeks to look like, in the simplest possible terms?",
action:"Look back at your week one entries. What would you say to the person who wrote those words?",
gratitude:"What are you grateful for about how far you've come, even if it doesn't feel far enough?"},
// ── Week 4 — Finding Ground ──────────────────────────────────
{day:22,week:4,
reading:"Stabilisation is different from healing. It just means the ground has stopped moving under your feet long enough for you to find your footing. It doesn't mean okay. It means: I know where I am. That's enough for now.",
journal:"What does 'finding your footing' mean for you right now? What would it feel like to be more grounded?",
reflection:"What is one area of your life where you feel most unsteady?",
action:"Establish one small daily anchor for this week — a morning routine, a regular mealtime, a walk. Consistency is ground.",
gratitude:"What feels more solid today than it did three weeks ago?"},
{day:23,week:4,
reading:"The legal and practical process takes longer than anyone tells you. It runs in the background, demanding attention at irregular intervals. The stress of uncertainty is real and different from grief. Both are happening at once.",
journal:"What practical or legal matter is weighing on you most right now? What's the fear underneath it?",
reflection:"Who is helping you with the practical side of this? Who do you wish was helping?",
action:"Identify one person — a lawyer, a financial advisor, a friend who's been through it — who could give you specific, useful advice on one matter. Make contact.",
gratitude:"What has been handled that you were worried wouldn't be?"},
{day:24,week:4,
reading:"Sleep changes in crisis. Maybe you can't fall asleep. Maybe you can't stay asleep. Maybe you're sleeping too much as an escape. Your sleep quality is directly connected to how you're coping during the day. It deserves attention.",
journal:"What is your sleep like right now? What goes through your mind in the dark? What helps?",
reflection:"What would need to change for you to sleep better?",
action:"Pick one sleep practice and commit to it this week: no screens an hour before bed, a consistent time, a short breathing practice.",
gratitude:"Name one moment yesterday when you felt even briefly at peace."},
{day:25,week:4,
reading:"Work can become either a refuge or an additional source of stress. Many people find it helpful in this period — it provides structure, purpose, and interruption from the internal monologue. Others find it's one thing too many. Which is it for you?",
journal:"How is work going right now? Is it a refuge or a weight — or both?",
reflection:"What do you need from your work life right now that you're not getting?",
action:"If work is a weight: identify one thing to ask for or change. If it's a refuge: let yourself be glad of it today.",
gratitude:"What does your work give you that you're grateful for?"},
{day:26,week:4,
reading:"When we're in prolonged stress, the fundamentals — sleep, food, movement, connection — are the things that keep us functional. Not luxuries. Infrastructure. Self-care is not indulgence. It's the maintenance of the machinery that carries everything else.",
journal:"Rate your current fundamentals honestly: sleep, food, movement, connection. Where are the biggest gaps?",
reflection:"What's one thing you could do this week to address the biggest gap?",
action:"Take a walk today — at least 20 minutes — with no destination and no podcast. Just you and the outside world.",
gratitude:"What small pleasure did you allow yourself today?"},
{day:27,week:4,
reading:"Your ex is a person too. Whatever happened, whatever was done — the marriage was made by two people and ended by two people. You don't have to feel sympathy. But bitterness that goes unexamined tends to calcify into something that harms you more than them.",
journal:"What do you still feel about your ex that you haven't fully looked at — not the anger, but what's underneath it?",
reflection:"What do you hope for your ex's life, if anything? It's okay if the answer is 'nothing yet.'",
action:"Write down one thing you respected about your ex during the marriage. Just one. You don't have to share it with anyone.",
gratitude:"What aspect of the marriage, however painful its ending, are you genuinely glad happened?"},
{day:28,week:4,milestone:true,
reading:"One month. This is a real milestone — not because everything is fixed, but because you've covered the hardest ground. Month one after separation is statistically the most acute. You're through it. The road ahead is still long, but it's different now.",
journal:"One month in. Write to yourself: what you've survived, what you know now, what you're carrying differently.",
reflection:"What has changed in you in one month that you want to keep?",
action:"Do something today that marks this month — not a celebration of the divorce, but an acknowledgment of your own endurance. A meal you love, something in nature, something that means something to you.",
gratitude:"What are you most grateful to have made it through?"},
// ── Week 5 — Small Rhythms ───────────────────────────────────
{day:29,week:5,
reading:"Routines are not a small thing. After upheaval, the reassertion of predictable rhythms is one of the fastest ways to rebuild a sense of self. Waking at the same time. A morning practice. A walk. Small things — but they make a skeleton for the day.",
journal:"What rhythms or routines are helping you right now? What rhythms are missing that used to anchor you?",
reflection:"What would your ideal daily routine look like? What's preventing it?",
action:"Identify one daily practice to establish this week. Commit to it for seven days.",
gratitude:"What familiar habit or ritual are you glad you still have?"},
{day:30,week:5,milestone:true,
reading:"Thirty days. One month of showing up. Whatever else is true, this is true: you have chosen, every day for thirty days, to engage with your own recovery rather than turn away from it. That is not a small thing. It is the whole thing.",
journal:"Day thirty. What has this month given you — not fixed, not resolved, but given you? What do you know now that you didn't know then?",
reflection:"Who was the most important person to your survival this month — and have you told them?",
action:"Tell one person in your life that you've made it a month. You don't have to explain what that means. But say it.",
gratitude:"Looking at the full thirty days: what moment, however small, are you most grateful for?"},
{day:31,week:5,
reading:"Anger at yourself is common in divorce. We replay the moments of failure — the things we said, the patterns we couldn't break. The question is not whether self-criticism is warranted. It's whether it's useful. Is the inventory serving you, or is it a loop?",
journal:"What are you most critical of yourself about in the marriage? Is that criticism helping you, or is it just noise?",
reflection:"What would you say to a close friend who was running the same loop about themselves?",
action:"Write down one thing you did well in the marriage. Not to balance the bad — just because it's also true.",
gratitude:"What quality in yourself are you grateful for, right now, specifically?"},
{day:32,week:5,
reading:"Social media and divorce are a difficult combination. Your ex's life becomes available to you in ways that can set back weeks of progress in minutes. How it affects you is entirely your business — and worth being deliberate about.",
journal:"What do you do with information about your ex that comes through social media or mutual friends? How does it affect you?",
reflection:"What would be the most self-protective thing you could do with that information flow right now?",
action:"If there's a social media account or mutual friend's updates that is harming you: mute, unfollow, or step back. You can undo it later.",
gratitude:"What aspect of your current life is better than it would appear on social media?"},
{day:33,week:5,
reading:"Loneliness is one of the most honest parts of divorce. Not the loneliness of being alone — the loneliness of having been close to someone and now not being. That specific loneliness, the kind that knows what it's missing, is very hard. It can't be fixed by company. It needs to be grieved.",
journal:"What kind of loneliness are you experiencing right now? Is it the aloneness of a quiet house, or something deeper?",
reflection:"What would it mean to grieve the specific companionship you've lost, rather than trying to fill it?",
action:"Spend an evening alone intentionally — not distracted, not filling it. Just you and the quiet. See what comes up.",
gratitude:"What have you learned about yourself from being more alone than you used to be?"},
{day:34,week:5,
reading:"The healing process is not linear. You will have good days followed by surprisingly bad days. Something will trigger you — a song, a date, a smell — and you'll feel like you're back at day one. You're not. Regression is part of the process. The bad day doesn't undo the progress.",
journal:"Have you had a setback day recently? What triggered it? What did you do?",
reflection:"What do you notice about the things that still catch you off guard?",
action:"Identify your two or three biggest current triggers. Write them down. Knowing them is the beginning of navigating them.",
gratitude:"What have you recovered from this week — even a small moment of feeling worse and then better?"},
{day:35,week:5,
reading:"Five weeks in. You are no longer in crisis mode. The task is shifting from survival to stabilisation — from 'getting through the day' to 'beginning to build something.' That shift happens gradually. It's already happening.",
journal:"Five weeks in — what does your daily life look like now compared to week one? What has changed in your patterns or state of mind?",
reflection:"What is one thing you have rebuilt or stabilised in the last five weeks, however small?",
action:"Make a list of three things in your life that are working right now. Not things that need fixing — things that are actually working.",
gratitude:"What does 'stability' feel like to you right now, even partially?"},
// ── Week 6 — What Remains ────────────────────────────────────
{day:36,week:6,
reading:"What did you love before the marriage? Not things you shared with your ex — the things that were yours, that you brought into the relationship. Divorce is also, sometimes, a return to self. Some of those things are still there, waiting.",
journal:"What did you love before the marriage — hobbies, interests, pleasures — that got set aside or diminished during it?",
reflection:"What would it mean to reclaim one of those things now?",
action:"Do one thing today that you loved before the marriage and haven't done enough of since.",
gratitude:"What part of your pre-marriage self are you glad to be reconnecting with?"},
{day:37,week:6,
reading:"The quality of your inner voice matters enormously right now. That voice narrating your life — is it supportive, or is it merciless? Most of us, under stress, become our own harshest critic. But the voice you speak to yourself with is trainable, if slowly.",
journal:"What does your inner voice say to you most often right now? Write some of it down, as honestly as you can.",
reflection:"Would you speak to a friend the way you speak to yourself? What would you say instead?",
action:"Notice your inner voice three times today. Each time, ask: is this helpful? If not, say something more accurate.",
gratitude:"What is one thing you said kindly to yourself today, or could have?"},
{day:38,week:6,
reading:"Some things from the marriage are worth keeping: values you developed together, friendships you made, places you love, things you learned. The ending of the marriage doesn't cancel its contents. Some of what you built is still yours.",
journal:"What do you want to keep from the marriage — not possessions, but things you gained: values, friendships, experiences, growth?",
reflection:"What part of the married version of you are you glad to keep?",
action:"Write down three things the marriage gave you that you're still grateful for, even now.",
gratitude:"What continues from the marriage into your life now that you're glad of?"},
{day:39,week:6,
reading:"Forgiveness is not required yet. That's a later chapter. But the resentment you carry has a weight, and at some point you'll want to examine whether you're carrying it because it's useful or because you haven't yet had the energy to put it down.",
journal:"What resentments are you carrying? Which ones feel useful and which ones feel like they're just wearing you out?",
reflection:"What would it feel like to put down one resentment — not forgive it, just stop actively carrying it?",
action:"Write down one resentment you'd be willing to loosen your grip on — just slightly. Not let go, just hold a little lighter.",
gratitude:"What has become lighter in the last six weeks, even if only a little?"},
{day:40,week:6,
reading:"You are becoming someone different. Not better or worse — just different. The marriage shaped you. The divorce is shaping you. Who you are becoming is still being written. That's not loss. That's the condition of being alive.",
journal:"Who are you becoming? What qualities do you see emerging that weren't there before, or weren't as strong?",
reflection:"What kind of person do you want to become through this, not despite it?",
action:"Write a one-paragraph description of the person you are becoming. Not aspirational — observational. Who is actually emerging?",
gratitude:"What are you growing into that you're grateful for?"},
{day:41,week:6,
reading:"The children, if you have them, are building their own story about what happened. Your relationship with them is one of the most important things you will rebuild — and it doesn't require the divorce to be resolved, just your presence to be consistent.",
journal:"If you have children: what do you want your relationship with them to look like in a year? What do you want them to carry from this period? If you don't: what relationship most needs your consistency right now?",
reflection:"What does consistent presence look like for you, given everything?",
action:"Plan one thing with your children or someone you love for this week. Put it in the calendar.",
gratitude:"What has your love for someone given you through this period?"},
{day:42,week:6,
reading:"Six weeks. You are solidly in the stabilisation phase now. The crisis is not over, but you're no longer just surviving it — you're beginning to shape it. That's a real shift. The next phase is about rebuilding — not just holding on, but actually building something.",
journal:"Six weeks in. What feels different about where you are compared to week one? What have you stabilised?",
reflection:"What is the most important thing to rebuild first?",
action:"Write down what you want the next six weeks to feel like. Not a goal list — a feeling. How do you want to be moving through life at week twelve?",
gratitude:"What do you have at six weeks that you didn't have at week one?"},
// ── Week 7 — Who You Are Now ─────────────────────────────────
{day:43,week:7,
reading:"Identity is not fixed. It was never fixed. The version of you that existed in the marriage was a version — real, but one among several that you've been and will be. Divorce doesn't erase identity. It makes space for questions about it. Those questions are also an opening.",
journal:"Who are you outside of the role of 'spouse' or 'ex'? What aspects of your identity feel most solid right now?",
reflection:"What does 'knowing yourself' mean to you — and how well do you feel you know yourself right now?",
action:"Write down five things that are true about you that have nothing to do with the marriage or divorce. Read them back. Let them be yours.",
gratitude:"What part of your identity are you most grateful to have access to right now?"},
{day:44,week:7,
reading:"Values. The things you believe matter — honesty, loyalty, family, freedom, creativity. Your values may have been tested by the marriage and its ending. Some may have been clarified. This is a good time to look at what you're actually rebuilding toward.",
journal:"What do you value most? Write your top five values. Then ask: are you living in alignment with them right now?",
reflection:"Has this experience changed what you value, or clarified what you always valued?",
action:"Choose the one value that feels most important right now. Make one decision today that reflects it.",
gratitude:"What value did the marriage help you understand more deeply?"},
{day:45,week:7,
reading:"Boundaries. The clear knowing of what you will and won't accept from your life and the people in it. Divorce often reveals where the old boundaries were too soft. That's useful information — painful, but useful.",
journal:"Where are you struggling with boundaries right now — in the divorce process, with your ex, with family, or with yourself?",
reflection:"What is one boundary you know you need to strengthen? What makes that difficult?",
action:"Name one boundary and say it out loud to yourself. Then say it to one other person, if appropriate.",
gratitude:"What boundary have you successfully held in the last few weeks that you're proud of?"},
{day:46,week:7,
reading:"Confidence takes a hit in divorce. Even when it was the right decision, the experience of a relationship failing erodes trust in your own judgment, your own lovability. That erosion is temporary. It is not a verdict on who you are.",
journal:"In what areas of your life do you feel most confident right now? Where has confidence taken the biggest hit?",
reflection:"What would it take to rebuild confidence in the area that needs it most?",
action:"Do one thing today that you know you're good at. Remind yourself of your competence in an area that has nothing to do with relationships.",
gratitude:"What has this period shown you about your own competence?"},
{day:47,week:7,
reading:"The question of what you want is different from what you need. Wants have been temporarily suspended — the wants that involved the marriage, a shared future, the shape of the life you planned. But underneath the suspended wants, needs remain: safety, connection, purpose, growth.",
journal:"What do you need right now — not want, but genuinely need? List them without judgment.",
reflection:"How many of your current needs are actually being met? Which is most urgent?",
action:"Identify the one need that is least met and take one concrete step toward meeting it today.",
gratitude:"What need of yours is being met right now, even imperfectly?"},
{day:48,week:7,
reading:"Comparison is dangerous in recovery. Other people's divorces, other people's timelines — these are not useful benchmarks. Your recovery is your recovery. It has its own shape and pace. The only comparison that matters is you at day one versus you now.",
journal:"Are you comparing your recovery to someone else's? What does that comparison feel like, and what is it doing to you?",
reflection:"What would it mean to fully own your own timeline for healing?",
action:"Write yourself one sentence: 'My recovery looks like ___.' Make it true, not aspirational.",
gratitude:"What is unique about the way you're handling this that you can respect?"},
{day:49,week:7,
reading:"Seven weeks. You are well into the rebuild phase. The foundations have been laid. You have survived the acute phase, stabilised the basics, and begun to ask the questions of identity and values that recovery demands. The work from here is slower, less dramatic, and more permanent.",
journal:"Seven weeks in. What have you rebuilt so far? What are you building now?",
reflection:"What would you build next, if you could?",
action:"Describe your ideal daily life in three months' time. Not a fantasy — something realistic and genuinely attainable.",
gratitude:"What has the rebuilding process given you that surviving alone never could?"},
// ── Week 8 — Your Relationships ──────────────────────────────
{day:50,week:8,
reading:"The relationships around you have been reorganised by the divorce — whether or not you wanted them to be. This is a good time to take stock. Who is in your life? Who has moved closer? Who has moved away? Who do you want to invest in from here?",
journal:"Map your current relationships honestly: who is close, who is peripheral, who is absent. What do you notice?",
reflection:"What kind of relationships do you most want in your life now, compared to before?",
action:"Invest specifically in one relationship this week — a call, a meal, a message that's more than a check-in.",
gratitude:"What relationship in your life are you most grateful for right now?"},
{day:51,week:8,
reading:"The co-parenting relationship, if you have children, is one of the most challenging things divorce creates. You're no longer in a marriage with this person, but you're permanently in a co-parenting relationship. That relationship has its own rules — different from marriage, different from friendship.",
journal:"If you have children: how is the co-parenting relationship? What's working? What isn't? If you don't: what relationship with your ex, if any, do you need to navigate?",
reflection:"What would a healthy, sustainable version of your relationship with your ex look like?",
action:"Identify one concrete thing that would improve the co-parenting dynamic — something within your control — and do it or begin it.",
gratitude:"What is your ex doing well for your children, even if it's hard to acknowledge?"},
{day:52,week:8,
reading:"New friendships are possible. The social reorganisation that follows divorce creates space — uncomfortable at first, but space — for different kinds of connection. People who've been through it. People who know you as you are now, not as you were.",
journal:"Is there someone new in your life since the divorce who has become important to you? Or someone you'd like to know better?",
reflection:"What would you want new friends to know about you — the you that exists now?",
action:"Take one step toward a new connection this week: accept an invitation, start a conversation, say yes to something you'd normally decline.",
gratitude:"What unexpected connection has come from this difficult time?"},
{day:53,week:8,
reading:"Family. Whether they've been supportive, complicated, absent, or too present — family relationships around a divorce are rarely neutral. People take positions. Old dynamics resurface. What you need and what you're getting may be very different.",
journal:"What has your family's response to the divorce been like? What have you needed from them, and what have you actually received?",
reflection:"What do you wish your family understood that they don't?",
action:"If there's a family relationship that needs a direct conversation about what you need — plan how you'd have it.",
gratitude:"What has a family member done for you during this time that meant something?"},
{day:54,week:8,
reading:"Intimacy after divorce is a complicated question — not just physical intimacy, but emotional intimacy, the willingness to be known. Divorce can damage the capacity for it. The rebuilding of intimacy capacity is slow and happens in friendships first, long before romantic relationships.",
journal:"How is your capacity for closeness and vulnerability right now? Are you more guarded than before? Less?",
reflection:"What would it take to feel safe enough to be truly known by someone again?",
action:"Share something honest and personal with one person in your life today — something that requires a small degree of trust.",
gratitude:"Who has allowed you to be vulnerable during this time without making you regret it?"},
{day:55,week:8,
reading:"The 'what people think' burden is heavy. What will people say? What do they already know? What is my ex saying? The constant awareness of being observed and judged adds exhaustion to an already exhausting situation. At some point, this burden has to be laid down.",
journal:"Whose opinion of you feels most burdening right now? What are you afraid they think or will think?",
reflection:"What would change if you decided that their opinion was simply not your responsibility?",
action:"Choose one person's opinion that you are giving too much weight to, and consciously decide to release it — just for today.",
gratitude:"Whose opinion of you has been unconditionally supportive?"},
{day:56,week:8,
reading:"Eight weeks. Your social world is being rebuilt, slowly and imperfectly. The relationships that have stayed were the ones worth keeping. The ones that left have made space for something more appropriate to who you're becoming.",
journal:"Eight weeks in on relationships: who has stayed, who has gone, and what has the reshaping of your social world given you?",
reflection:"What kind of relationships do you want to build from here?",
action:"Write down the qualities you want in the people closest to you going forward. Let that list guide how you invest your time.",
gratitude:"What has going through this shown you about who your real people are?"},
// ── Week 9 — Practical Life ──────────────────────────────────
{day:57,week:9,
reading:"The practical infrastructure of your life — housing, finances, legal status, childcare arrangements — is the foundation everything else rests on. Whatever the state of it, getting clear on where you stand is better than carrying anxiety about the unknown.",
journal:"Where are you practically right now? Housing, finances, legal status, childcare if relevant. Write the reality without catastrophising.",
reflection:"What would it look like to have this area of your life sorted enough to stop draining your energy?",
action:"Choose the most pressing practical matter and do one concrete thing to advance it today.",
gratitude:"What practical matter has been resolved that you're relieved about?"},
{day:58,week:9,
reading:"Financial independence — or greater financial independence — is something many people rebuild after divorce. The relationship you have with money now is yours. Learning to manage it, plan with it, and not fear it is part of building the new life.",
journal:"What is your relationship with money like right now? What do you wish it looked like?",
reflection:"What is the most important financial thing to address in the next six months?",
action:"Look at your finances today with clear eyes. Just look — not to solve, just to know where you stand.",
gratitude:"What financial resource or security do you have right now that you're grateful for?"},
{day:59,week:9,
reading:"Housing is more than shelter. The space you live in shapes your sense of self, your mood, your capacity to recover. Whether you're in a new place, an old home with new echoes, or somewhere temporary — the quality of your domestic space matters. It's worth tending.",
journal:"How is your home feeling right now? Is it a place that supports your recovery, or is it adding to the difficulty?",
reflection:"What would it take to make your living space more genuinely supportive?",
action:"Do one thing today to improve your living space — a small purchase, a reorganisation, a deep clean of one room.",
gratitude:"What do you have in your home right now that gives you comfort?"},
{day:60,week:9,milestone:true,
reading:"Sixty days. Two months of showing up. You have survived the acute crisis, stabilised the basics, and begun rebuilding. You are not the person who arrived at day one. That person is still in you, but they have company now.",
journal:"Day sixty. Write to yourself: what you've covered in two months, what you know now, what you're carrying differently, what you're building.",
reflection:"What does the next thirty days need to focus on?",
action:"Do something today that you couldn't have done, or wouldn't have thought to do, at day one. Something that reflects how you've changed.",
gratitude:"Looking back across sixty days: what are you most grateful to have made it through, and most grateful to have gained?"},

async function ai(messages, system) {
  // Calls Supabase Edge Function proxy to avoid CORS restrictions
  const proxyUrl = S.sbUrl + '/functions/v1/companion';
  const r = await fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.sbKey },
    body: JSON.stringify({ messages, system })
  });
  if (!r.ok) {
    let msg = 'Proxy error';
    try { const e = await r.json(); msg = e.error?.message || JSON.stringify(e); } catch(_) {}
    throw new Error(r.status + ': ' + msg);
  }
  const data = await r.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.content[0].text;
}

async function handleEmailAuth() {
  const email=(document.getElementById('a-email')?.value||S.authEmail).trim();
  const pass=document.getElementById('a-pass')?.value||S.authPass;
  const name=(document.getElementById('a-name')?.value||S.authName).trim();
  if(!email||!pass){S.err='Please enter your email and password.';R();return;}
  S.loading=true;S.err='';R();
  try{
    if(S.authMode==='signup'){
      if(pass.length<8)throw new Error('Password must be at least 8 characters.');
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name||email.split('@')[0]}}});
      if(error)throw error;
      if(!data.session){S.verifyPending=true;S.loading=false;R();return;}
      await handleSession(data.session,name);
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      await handleSession(data.session);
    }
  }catch(e){S.err=e.message.replace('AuthApiError: ','');}
  S.loading=false;R();
}

async function handleAppleAuth() {
  if(!sb){S.err='Not connected.';R();return;}
  S.loading=true;S.err='';R();
  try{
    const {error}=await sb.auth.signInWithOAuth({
      provider:'apple',
      options:{redirectTo:window.location.href.split('#')[0].split('?')[0],scopes:'name email'}
    });
    if(error)throw error;
    // Redirect happens — show nothing, browser leaves page
  }catch(e){
    S.err='Apple Sign-In failed: '+e.message+'. Enable Apple in Supabase Dashboard → Authentication → Providers.';
    S.loading=false;R();
  }
}

async function handleSession(session, overrideName) {
  const u = session.user;
  try{
    const profile = await getOrCreateProfile(u, overrideName||S.authName||u.user_metadata?.full_name);
    S.userId=profile.id; S.userName=profile.name; S.userStage=profile.divorce_stage||'';
    S.userPriorities=profile.priorities||[]; S.dayCount=profile.day_count||1; S.streak=profile.streak||1;
    if(!profile.divorce_stage){ S.screen='onboarding'; S.obStep=1; }
    else {
      const fp=await loadFaithProgress();
      if(fp){
        S.faith.enrolled=true; S.faith.stage=fp.stage||''; S.faith.denominations=fp.denominations||[];
        S.faith.concerns=fp.concerns||[]; S.faith.journalConsent=fp.journal_consent||false;
        S.faith.modulesCompleted=fp.modules_completed||[]; S.faith.hasChildren=fp.has_children??null; S.isChristian=true;
      }
      S.faith.jEntries=await loadFaithJournals();
      const rp=await loadRecoveryProgress();
      if(rp) S.recovery.daysCompleted=rp.days_completed||[];
      S.convs=await loadConvs();
      await loadHomeData();
      S.screen='home';
    }
  }catch(e){ S.err='Could not load profile: '+e.message; S.screen='auth'; }
}

    S.jLoading=false;

}

    try{
      await saveJournal(S.jPrompt,t);
      S.journalEntries=await loadJournals();
      // Switch to reflect phase — companion responds to the entry
      S.jConvs=[]; S.jIsTyping=true; S.jPhase='reflect'; R();
      try{
        const reply=await ai(
          [{role:'user',content:S.jText}],
          SYS_JOURNAL_REFLECT(S.jPrompt,S.jText)
        );
        S.jConvs=[{role:'assistant',content:reply}];
      }catch(e){
        S.jConvs=[{role:'assistant',content:"I'm having a little trouble right now. Take your time — I\'ll be here when you're ready to talk about what you wrote."}];
      }
      S.jIsTyping=false; S.jText=''; R();

  w.querySelectorAll('[data-entry-id]').forEach(card=>{

        .catch(()=>{ S.jConvs=[{role:'assistant',content:"I'm here whenever you're ready to talk about this."}]; S.jIsTyping=false; R(); });
    });
  });
  return w;
}

        <div class="phase-hdr">${phase.title}</div>
        ${FAITH_MODULES.filter(m=>m.phase===phase.num).map(m=>{
          // Module 9 (children) — only show if user has children
          if(m.num===9 && S.faith.hasChildren===false) return '';
          const isDone=done.includes(m.num);
          const isNext=m.num===nextM.num&&!isDone;
          const isLocked=!isDone&&m.num>(done.length?Math.max(...done)+1:1)&&!isNext;
          return `<div class="module-row ${isDone?'module-done':''} ${isLocked?'module-locked':''}" data-mnum="${m.num}">
            <div class="module-num ${isDone?'done':''}">${isDone?'✓':m.num}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:${isNext?'500':'400'};color:${isLocked?'var(--stone)':isNext?'var(--amber-dark)':'var(--text)'}">${m.title}</div>
              <div style="font-size:11px;color:var(--dusk);margin-top:2px;line-height:1.4">${m.purpose.split(',')[0]}</div>
            </div>
            ${isNext?`<div style="font-size:10px;font-weight:500;color:var(--amber);background:var(--amber-light);padding:3px 8px;border-radius:99px;border:0.5px solid var(--amber-border)">Next</div>`:''}
            ${isLocked?`<div style="font-size:16px;color:var(--stone)">🔒</div>`:''}
          </div>`;
        }).join('')}
      `).join('')}
            <div class="phase-hdr" style="color:var(--amber-dark)">Resources</div>
      ${DEEP_DIVES.map(d=>`<div class="module-row" data-dd="${d.id}" style="border-color:var(--amber-border)"><div class="module-num" style="background:var(--amber-light);border-color:var(--amber-border);color:var(--amber-dark)">✦</div><div style="flex:1"><div style="font-size:13px;font-weight:500;color:var(--amber-dark)">Deep-Dive ${d.letter}: ${d.title}</div><div style="font-size:11px;color:var(--dusk);margin-top:2px">${d.subtitle}</div></div><div style="font-size:14px;color:var(--amber)">›</div></div>`).join('')}
      <div style="height:10px"></div>
    `;

  on(w,'#faith-settings-home-btn','click',()=>{ S.screen='faithSettings'; R(); });
  on(w,'#faith-companion-btn','click',()=>{
    if(!S.faith.companionConvs.length){
      const op=`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`;
      S.faith.companionConvs=[{role:'assistant',content:op}];
    }
    S.screen='faithCompanion'; R();
  });
  w.querySelectorAll('[data-dd]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.dd;
      S.faith.currentDeepDive=DEEP_DIVES.findIndex(d=>d.id===id);
      S.screen='faithDeepDive'; R();
    });
  });
  w.querySelectorAll('[data-mnum]').forEach(el=>{
    el.addEventListener('click',()=>{
      const num=parseInt(el.dataset.mnum);
      const mod=getFaithModule(num);
      const isDone=done.includes(num);
      const isLocked=!isDone&&num>(done.length?Math.max(...done)+1:1)&&num!==nextM.num;
      if(isLocked) return;
      S.faith.currentModule=num;
      S.screen='faithModule'; R();
    });
  });
  return w;
}

function rFaithModule() {
  const mod = getFaithModule(S.faith.currentModule);
  const isDone = S.faith.modulesCompleted.includes(mod.num);
  const w = el('div','screen linen-bg');

  const sectionsHtml = mod.sections.map((s,i)=>{
    // Format content: handle newlines, scripture quotes (lines starting with ")
    const formatted = s.content.split('\n\n').map(para=>{
      if(!para.trim()) return '';
      // Scripture block: paragraph containing em-dash attribution or starts with quote mark
      if((para.includes('\u2014') || para.match(/^[\u201C"]/)) && para.length < 400){
        const lines = para.split('\n').map(l=>l.trim()).filter(Boolean);
        return '<div class="scripture-block">' + lines.map(l=>`<div style="margin-bottom:4px">${l}</div>`).join('') + '</div>';
      }
      return `<p style="margin-bottom:12px;font-size:14px;line-height:1.8;color:var(--text);font-weight:300">${para.trim()}</p>`;
    }).join('');
    return `<div class="reading-section">
      <div class="section-title">${s.title}</div>
      <div class="section-content">${formatted}</div>
    </div>`;
  }).join('');

  w.innerHTML=`
    <div class="status-bar" style="background:var(--amber-light)"><span style="font-size:11px;color:var(--amber-dark)">9:41</span><span style="font-size:11px;color:var(--amber)">●●●</span></div>
    <div style="background:var(--amber-light);padding:10px 16px 14px;border-bottom:0.5px solid var(--amber-border);flex-shrink:0;display:flex;align-items:center;gap:10px">
      <div id="bk-module" style="font-size:20px;color:var(--amber-dark);cursor:pointer;padding:2px 4px;line-height:1">‹</div>
      <div style="flex:1">
        <div class="t-label" style="color:var(--amber);margin-bottom:2px">${mod.phaseTitle} · Module ${mod.num}</div>
        <div style="font-family:var(--serif);font-size:16px;color:var(--amber-dark);line-height:1.3">${mod.title}</div>
      </div>
    </div>
    <div class="scroll-content" style="padding:20px 20px 0">
      <div style="font-family:var(--serif);font-size:13px;color:var(--amber);font-style:italic;margin-bottom:20px;line-height:1.6">${mod.headline||''}</div>
      ${sectionsHtml}
      <div style="background:var(--amber-light);border-radius:var(--r-lg);border:0.5px solid var(--amber-border);padding:16px;margin-bottom:16px">
        <div class="t-label" style="color:var(--amber);margin-bottom:8px">Journal prompt</div>
        <div style="font-family:var(--serif);font-size:15px;color:var(--amber-dark);line-height:1.6;font-style:italic;margin-bottom:10px">"${mod.promptText}"</div>
        <div style="font-size:12px;color:var(--dusk);line-height:1.6;margin-bottom:12px">${mod.promptGuidance}</div>
        <button id="go-journal" class="btn btn-faith btn-sm">Open journal for this prompt</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button id="go-companion" class="btn btn-faith-ghost btn-sm" style="flex:1;border-radius:10px">Talk to companion</button>
        ${!isDone?`<button id="mark-done" class="btn btn-faith btn-sm" style="flex:1;border-radius:10px">Mark complete</button>`:`<div style="flex:1;padding:9px;text-align:center;font-size:12px;color:var(--amber-dark);background:var(--amber-light);border-radius:10px;border:0.5px solid var(--amber-border)">✓ Completed</div>`}
      </div>
    </div>`;

  on(w,'#bk-module','click',()=>{ S.screen='faithHome'; R(); });
  on(w,'#go-journal','click',()=>{
    S.faith.jPromptId=mod.promptId; S.faith.jPromptText=mod.promptText;
    S.faith.jPhase='write'; S.faith.jText='';
    S.screen='faithJournal'; R();
  });
  on(w,'#go-companion','click',()=>{
    const trigger = mod.companionTrigger;
    if(!S.faith.companionConvs.length && trigger){
      S.faith.companionConvs=[{role:'assistant',content:trigger}];
    } else if(!S.faith.companionConvs.length){
      S.faith.companionConvs=[{role:'assistant',content:`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`}];
    }
    S.screen='faithCompanion'; R();
  });
  on(w,'#mark-done','click',async()=>{
    if(!S.faith.modulesCompleted.includes(mod.num)){
      S.faith.modulesCompleted=[...S.faith.modulesCompleted,mod.num];
      await saveFaithProgress({modules_completed:S.faith.modulesCompleted});
    }
    S.screen='faithHome'; R();
  });
  return w;
}

        <textarea id="fci" class="input input-light" placeholder="Write back…" style="flex:1;border-radius:20px;resize:none;min-height:40px;padding:10px 14px;line-height:1.4;border-color:var(--amber-border)" rows="1"></textarea>
        <button id="fc-send" style="width:38px;height:38px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 2L8 14L7 9L2 8Z" fill="#fff"/></svg>
        </button>
      </div>
    </div>`;
  setTimeout(()=>{
    const thread=w.querySelector('#fc-thread'); thread.scrollTop=thread.scrollHeight;
    on(w,'#bk-fc','click',()=>{ S.screen='faithHome'; R(); });
    const inp=w.querySelector('#fci');
    const send=async()=>{
      const t=inp.value.trim(); if(!t||S.faith.companionTyping)return;
      inp.value=''; inp.style.height='auto';
      S.faith.companionConvs.push({role:'user',content:t});
      S.faith.companionTyping=true; R();
      try{
        const reply=await ai(
          S.faith.companionConvs.map(m=>({role:m.role,content:m.content})),
          SYS_FAITH_COMPANION()
        );
        S.faith.companionConvs.push({role:'assistant',content:reply});
      }catch(e){
        S.faith.companionConvs.push({role:'assistant',content:"I'm having trouble connecting right now ("+( e.message||'unknown error')+"). Please try again in a moment."});
      }
      S.faith.companionTyping=false; R();
    };
    on(w,'#fc-send','click',send);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
    inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});
  },0);
  return w;
}

function rFaithDeepDive() {
  const w = el('div','screen linen-bg');
  const dd = DEEP_DIVES[S.faith.currentDeepDive] || DEEP_DIVES[0];

  // Build sections HTML — handle scripture sections differently
  const sectionsHtml = dd.sections.map(s=>{
    if(s.isScripture && s.passages){
      const passagesHtml = s.passages.map(p=>`
        <div style="margin-bottom:16px">
          <div class="scripture-block">
            <div style="font-size:11px;font-weight:500;color:var(--amber-dark);letter-spacing:0.06em;margin-bottom:6px">${p.ref}</div>
            <div style="font-family:var(--serif);font-size:14px;line-height:1.75;color:var(--amber-dark)">"${p.text}"</div>
          </div>
          <div style="font-size:13px;color:var(--dusk);line-height:1.6;padding:6px 0 0;font-weight:300">${p.note}</div>
        </div>`).join('');
      return `<div class="reading-section"><div class="section-title">${s.title}</div>${passagesHtml}</div>`;
    }
    // Regular text section
    const formatted = s.content.split('\n\n').map(para=>{
      if(!para.trim()) return '';
      return `<p style="margin-bottom:12px;font-size:14px;line-height:1.8;color:var(--text);font-weight:300">${para.trim()}</p>`;
    }).join('');
    return `<div class="reading-section"><div class="section-title">${s.title}</div>${formatted}</div>`;
  }).join('');

  // Intro paragraphs
  const introHtml = dd.intro.split('\n\n').map(p=>
    `<p style="font-size:14px;line-height:1.8;color:var(--text);font-weight:300;margin-bottom:12px">${p.trim()}</p>`
  ).join('');

  w.innerHTML=`
    <div class="status-bar" style="background:var(--amber-light)"><span style="font-size:11px;color:var(--amber-dark)">9:41</span><span style="font-size:11px;color:var(--amber)">●●●</span></div>
    <div style="background:var(--amber-light);padding:10px 16px 14px;border-bottom:0.5px solid var(--amber-border);flex-shrink:0;display:flex;align-items:flex-start;gap:10px">
      <div id="bk-dd" style="font-size:20px;color:var(--amber-dark);cursor:pointer;padding:2px 4px;line-height:1;flex-shrink:0;margin-top:2px">‹</div>
      <div style="flex:1">
        <div class="t-label" style="color:var(--amber);margin-bottom:3px">Deep-Dive ${dd.letter}</div>
        <div style="font-family:var(--serif);font-size:17px;color:var(--amber-dark);line-height:1.3">${dd.title}</div>
        <div style="font-size:12px;color:var(--dusk);margin-top:3px">${dd.subtitle}</div>
      </div>
    </div>
    <div class="scroll-content" style="padding:20px 20px 0">
      <div style="margin-bottom:20px">${introHtml}</div>
      ${sectionsHtml}
      <div style="background:var(--amber-light);border-radius:var(--r-lg);border:0.5px solid var(--amber-border);padding:14px;margin-bottom:20px">
        <div style="font-size:13px;color:var(--amber-dark);line-height:1.6;margin-bottom:10px;font-family:var(--serif);font-style:italic">Your companion can engage with any of these questions in more depth.</div>
        <button id="dd-companion-btn" class="btn btn-faith btn-sm">Talk to companion about this</button>
      </div>
    </div>`;

  on(w,'#bk-dd','click',()=>{ S.screen='faithHome'; R(); });
  on(w,'#dd-companion-btn','click',()=>{
    const prompts = {
      'A': `I've just read about the different denominational positions on divorce. I have some questions about what my tradition believes.`,
      'B': `I'm thinking about finding a spiritual director or pastor to talk to. Can you help me think through that?`,
      'C': `I've been reading through the Scripture passages. One of them particularly stayed with me and I\'d like to explore it.`,
    };
    if(!S.faith.companionConvs.length){
      S.faith.companionConvs=[{role:'assistant',content:`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`}];
    }
    S.faith.companionConvs.push({role:'user',content:prompts[dd.id]||"I've been reading through the resources and have some questions."});
    S.faith.companionTyping=true;
    S.screen='faithCompanion'; R();
    ai(S.faith.companionConvs.map(m=>({role:m.role,content:m.content})),SYS_FAITH_COMPANION())
      .then(reply=>{S.faith.companionConvs.push({role:'assistant',content:reply});S.faith.companionTyping=false;R();})
      .catch(()=>{S.faith.companionConvs.push({role:'assistant',content:"I'm having trouble connecting right now. Please try again in a moment."});S.faith.companionTyping=false;R();});
  });
  return w;
}

function rRecoveryHome() {
  const w = el('div','screen linen-bg');
  const done = S.recovery.daysCompleted;
  const total = 91;
  const pct = Math.min(Math.round((done.length/total)*100),100);
  const currentDay = Math.min(done.length+1, total);
  const wk = getRecoveryWeek(Math.ceil(currentDay/7));

  const phases = [
    {label:'Survive', weeks:[1,2,3], color:'#6B8EAD'},
    {label:'Stabilise', weeks:[4,5,6], color:'#5B85CC'},
    {label:'Rebuild', weeks:[7,8,9,10], color:'#3D6CB5'},
    {label:'Thrive', weeks:[11,12,13], color:'#2A4D8F'},
  ];

  const weekRows = RECOVERY_WEEKS.map(wkd => {
    const wDays = RECOVERY_DAYS.filter(d => d.week === wkd.week);
    const wDone = wDays.filter(d => done.includes(d.day)).length;
    const isCurrentWk = wkd.week === Math.ceil(currentDay/7);
    const isComplete = wDone === 7;
    const isLocked = wkd.week > Math.ceil(currentDay/7);
    return `<div class="rec-week-row ${isLocked?'rec-locked':''}" data-week="${wkd.week}" style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-radius:var(--r-md);border:0.5px solid ${isCurrentWk?'var(--blue-border)':'var(--stone)'};margin-bottom:6px;cursor:${isLocked?'default':'pointer'}">
      <div style="width:28px;height:28px;border-radius:50%;background:${isComplete?'var(--blue)':'var(--blue-light)'};border:0.5px solid ${isComplete?'var(--blue)':'var(--blue-border)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${isComplete
          ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : `<span style="font-size:10px;font-weight:500;color:var(--blue-dark)">${wkd.week}</span>`}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue);margin-bottom:1px">${wkd.phase}</div>
        <div style="font-size:13px;font-weight:500;color:${isLocked?'var(--stone)':'var(--text)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${wkd.title}</div>
      </div>
      <div style="font-size:11px;color:var(--dusk);flex-shrink:0">${wDone}/7</div>
      ${isCurrentWk?'<div style="width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0"></div>':''}
    </div>`;
  }).join('');

  w.innerHTML=`
    <div class="status-bar status-light"><span>9:41</span><span>●●●</span></div>
    <div style="background:var(--blue);padding:10px 22px 20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div id="bk" style="color:rgba(255,255,255,0.6);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1">‹</div>
        <div style="flex:1">
          <div style="font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:2px">Track</div>
          <div style="font-size:16px;font-weight:500;color:#fff">90-Day Recovery</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-family:var(--serif);font-size:26px;color:#fff;line-height:1.2">${done.length===0?'Day one.':done.length===91?'Complete.':'Day '+currentDay+'.'}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px">${wk.phase} · ${wk.title}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:500;color:#fff">${pct}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.55);letter-spacing:0.08em">${done.length} of 91</div>
        </div>
      </div>
      <div style="height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden">
        <div style="height:100%;border-radius:2px;background:#fff;width:${pct}%;transition:width 0.4s ease"></div>
      </div>
    </div>
    ${currentDay<=91?`
    <div style="padding:14px 14px 4px;display:flex;gap:8px">
      <button id="open-today" class="btn" style="background:var(--blue);color:#fff;font-size:14px;flex:1">
        ${done.includes(currentDay)?'Revisit day '+currentDay:'Open day '+currentDay+' →'}
      </button>
      <button id="open-companion" style="width:44px;height:44px;border-radius:12px;background:var(--blue-light);border:0.5px solid var(--blue-border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 4a1.5 1.5 0 011.5-1.5h9A1.5 1.5 0 0115 4v6a1.5 1.5 0 01-1.5 1.5H7L3 14V4z" stroke="var(--blue)" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

  on(w,'#bk','click',()=>{ S.screen='tracks'; R(); });
  on(w,'#open-companion','click',async()=>{
    S.recovery.jEntries = await loadRecoveryJournals();
    if(!S.recovery.companionConvs.length){
      const dayNum = Math.min(S.recovery.daysCompleted.length+1,91);
      const wk = getRecoveryWeek(Math.min(Math.ceil(dayNum/7),13));
      const op = S.recovery.daysCompleted.length===0
        ? `Hi ${S.userName}. I'm glad you're here on day one. This is a space where you can bring whatever you're carrying right now — no agenda. How are you feeling?`
        : `Welcome back, ${S.userName}. You're ${S.recovery.daysCompleted.length} days in — ${wk.phase} phase, week ${Math.min(Math.ceil(dayNum/7),13)}. How's it actually going?`;
      S.recovery.companionConvs=[{role:'assistant',content:op}];
    }
    S.screen='recoveryCompanion'; R();
  });
  on(w,'#open-today','click',()=>{
    S.recovery.currentDayNum=currentDay;
    S.recovery.jText=''; S.recovery.gratText='';
    loadRecoveryJournals(currentDay).then(entries=>{ S.recovery.jEntries=entries; S.screen='recoveryDay'; R(); });
  });
  w.querySelectorAll('.rec-week-row:not(.rec-locked)').forEach(row=>{
    row.addEventListener('click', e => {
      if(e.target.closest('#open-today')) return;
      const wkNum = parseInt(row.dataset.week);
      const firstDayOfWeek = (wkNum-1)*7+1;
      S.recovery.currentDayNum = firstDayOfWeek;
      S.recovery.jText=''; S.recovery.gratText='';
      loadRecoveryJournals(firstDayOfWeek).then(entries=>{ S.recovery.jEntries=entries; S.screen='recoveryDay'; R(); });
    });
  });
  return w;

  const w = el('div','screen linen-bg');
  const dayNum = S.recovery.currentDayNum;
  const day = getRecoveryDay(dayNum);
  const wk = getRecoveryWeek(day.week);
  const isDone = S.recovery.daysCompleted.includes(dayNum);
  const existingJ = S.recovery.jEntries.find(e=>e.day_num===dayNum&&e.entry_type==='journal');
  const existingG = S.recovery.jEntries.find(e=>e.day_num===dayNum&&e.entry_type==='gratitude');
  const jVal = S.recovery.jText !== '' ? S.recovery.jText : (existingJ?.content||'');
  const gVal = S.recovery.gratText !== '' ? S.recovery.gratText : (existingG?.content||'');

  const milestoneMsg = day.milestone ? `
    <div style="background:var(--blue);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="white" stroke-width="1.5"/><path d="M7 10l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="font-size:13px;color:#fff;font-weight:500">Day ${dayNum} milestone</div>
    </div>` : '';

  w.innerHTML=`
    <div style="background:var(--blue);padding:10px 22px 16px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div id="bk" style="color:rgba(255,255,255,0.6);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1">‹</div>
        <div style="flex:1">
          <div style="font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55)">${wk.phase} · Week ${day.week}</div>
          <div style="font-size:15px;font-weight:500;color:#fff">${wk.title}</div>
        </div>
        <div style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.15);padding:3px 10px;border-radius:99px">Day ${dayNum}</div>
      </div>
    </div>
    <div class="scroll-content" style="padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px">
      ${milestoneMsg}

      <div>
        <div style="font-family:var(--serif);font-size:17px;color:var(--text);line-height:1.75;margin-bottom:6px">${day.reading}</div>
      </div>

      <div style="height:0.5px;background:var(--stone)"></div>

      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--blue-light);border:0.5px solid var(--blue-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M5 2v6" stroke="var(--blue)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="t-label" style="color:var(--blue-dark)">Today's reflection</div>
        </div>
        <div style="background:var(--blue-light);border-left:3px solid var(--blue);border-radius:0 var(--r-md) var(--r-md) 0;padding:10px 14px;font-size:13px;color:var(--blue-dark);line-height:1.65">${day.reflection}</div>
      </div>

      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--blue-light);border:0.5px solid var(--blue-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="var(--blue)" stroke-width="1"/><line x1="3.5" y1="4" x2="6.5" y2="4" stroke="var(--blue)" stroke-width="1" stroke-linecap="round"/><line x1="3.5" y1="6" x2="5.5" y2="6" stroke="var(--blue)" stroke-width="1" stroke-linecap="round"/></svg>
          </div>
          <div class="t-label" style="color:var(--blue-dark)">Journal</div>
        </div>
        <div style="font-size:13px;color:var(--text);line-height:1.65;margin-bottom:8px;font-style:italic">${day.journal}</div>
        <textarea id="j-text" class="j-textarea" style="border-color:var(--blue-border);min-height:120px" placeholder="Write here…">${jVal}</textarea>
      </div>

      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="width:20px;height:20px;border-radius:50%;background:var(--blue-light);border:0.5px solid var(--blue-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.5l.9 2.7H9L6.6 5.8l.9 2.7L5 7 2.5 8.5l.9-2.7L1 4.2h3.1z" stroke="var(--blue)" stroke-width="1" stroke-linejoin="round"/></svg>
          </div>
          <div class="t-label" style="color:var(--blue-dark)">Gratitude</div>
        </div>
        <div style="font-size:13px;color:var(--text);line-height:1.65;margin-bottom:8px;font-style:italic">${day.gratitude}</div>
        <textarea id="g-text" class="j-textarea" style="border-color:var(--blue-border);min-height:80px" placeholder="Write here…">${gVal}</textarea>
      </div>

      <div style="background:var(--linen);border-radius:var(--r-md);border:0.5px solid var(--blue-border);padding:12px 14px">
        <div class="t-label" style="color:var(--blue-dark);margin-bottom:6px">Today's action</div>
        <div style="font-size:13px;color:var(--text);line-height:1.65">${day.action}</div>
      </div>

      ${S.recovery.err?`<div class="err">${S.recovery.err}</div>`:''}
      <button id="save-btn" class="btn" style="background:var(--blue);color:#fff" ${S.recovery.saving?'disabled':''}>
        ${S.recovery.saving?'Saving…':isDone?'Update entries':'Mark day '+dayNum+' complete'}
      </button>
      ${dayNum < 91 ? `<button id="next-btn" class="btn btn-ghost-light" style="font-size:13px">Day ${dayNum+1} →</button>` : ''}
    </div>`;

  on(w,'#bk','click',()=>{ S.screen='recoveryHome'; R(); });

  w.querySelector('#j-text')?.addEventListener('input', e=>{ S.recovery.jText=e.target.value; });
  w.querySelector('#g-text')?.addEventListener('input', e=>{ S.recovery.gratText=e.target.value; });

  on(w,'#save-btn','click',async()=>{
    const jt=w.querySelector('#j-text')?.value.trim();
    const gt=w.querySelector('#g-text')?.value.trim();
    S.recovery.saving=true; S.recovery.err=''; R();
    try{
      if(jt) await saveRecoveryJournal(dayNum,'journal',jt);
      if(gt) await saveRecoveryJournal(dayNum,'gratitude',gt);
      if(!S.recovery.daysCompleted.includes(dayNum)){
        S.recovery.daysCompleted.push(dayNum);
        await saveRecoveryProgress({days_completed:S.recovery.daysCompleted});
        await updateProfile({day_count: S.recovery.daysCompleted.length});
        S.dayCount = S.recovery.daysCompleted.length;
      }
      S.recovery.jText=''; S.recovery.gratText='';
      S.screen='recoveryHome';
    }catch(e){ S.recovery.err='Could not save: '+e.message; }
    S.recovery.saving=false; R();
  });

  on(w,'#next-btn','click',()=>{
    S.recovery.currentDayNum=dayNum+1;
    S.recovery.jText=''; S.recovery.gratText='';
    loadRecoveryJournals(dayNum+1).then(entries=>{ S.recovery.jEntries=entries; R(); });
  });

  return w;
}

function rRecoveryCompanion() {
  const w = el('div','screen linen-bg');
  const dayNum = Math.min(S.recovery.daysCompleted.length+1,91);
  const wk = getRecoveryWeek(Math.min(Math.ceil(dayNum/7),13));
  const msgs = S.recovery.companionConvs.map(m=>
    m.role==='assistant'
      ? `<div class="bubble-row fade-in">
          <div style="width:22px;height:22px;border-radius:50%;background:var(--blue-light);border:0.5px solid var(--blue-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><circle cx="4.5" cy="4.5" r="3" stroke="var(--blue)" stroke-width="1.2"/></svg>
          </div>
          <div style="background:var(--blue-light);border-radius:14px 14px 14px 3px;padding:11px 14px;max-width:78%;font-family:var(--serif);font-size:13px;line-height:1.7;color:var(--blue-dark);font-style:italic">${m.content}</div>
        </div>`
      : `<div class="bubble-row fade-in" style="justify-content:flex-end">
          <div class="bubble-u">${m.content}</div>
        </div>`
  ).join('');
  const typ = S.recovery.companionTyping
    ? `<div class="bubble-row fade-in">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--blue-light);border:0.5px solid var(--blue-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><circle cx="4.5" cy="4.5" r="3" stroke="var(--blue)" stroke-width="1.2"/></svg>
        </div>
        <div class="typing-wrap" style="background:var(--blue-light)"><div class="td" style="background:var(--blue)"></div><div class="td" style="background:var(--blue)"></div><div class="td" style="background:var(--blue)"></div></div>
      </div>` : '';

  w.innerHTML=`
    <div style="background:var(--blue);padding:10px 22px 14px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:10px">
        <div id="bk" style="color:rgba(255,255,255,0.6);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1">‹</div>
        <div style="width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.15);border:0.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><circle cx="4.5" cy="4.5" r="3" stroke="white" stroke-width="1.2"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500;color:#fff">Recovery companion</div>
          <div style="font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.55)">${wk.phase} · Day ${dayNum}</div>
        </div>
      </div>
    </div>
    <div id="thread" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div class="t-label" style="text-align:center;color:var(--stone)">Today</div>
      ${msgs}${typ}
    </div>
    <div style="padding:8px 12px 16px;border-top:0.5px solid var(--stone);background:#fff;flex-shrink:0">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="mi" class="input input-light" placeholder="Write back…" style="flex:1;border-radius:20px;resize:none;min-height:40px;padding:10px 14px;line-height:1.4;border-color:var(--blue-border)" rows="1"></textarea>
        <button id="sb-btn" style="width:38px;height:38px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 2L8 14L7 9L2 8Z" fill="white"/></svg>
        </button>
      </div>
    </div>`;

  setTimeout(()=>{
    const thread=w.querySelector('#thread'); thread.scrollTop=thread.scrollHeight;
    on(w,'#bk','click',()=>{ S.screen='recoveryHome'; R(); });
    const inp=w.querySelector('#mi');
    const send=async()=>{
      const t=inp.value.trim(); if(!t||S.recovery.companionTyping)return;
      inp.value=''; inp.style.height='auto';
      S.recovery.companionConvs.push({role:'user',content:t});
      S.recovery.companionTyping=true; R();
      try{
        const reply=await ai(
          S.recovery.companionConvs.map(m=>({role:m.role,content:m.content})),
          SYS_RECOVERY_COMPANION()
        );
        S.recovery.companionConvs.push({role:'assistant',content:reply});
      }catch(e){
        S.recovery.companionConvs.push({role:'assistant',content:"I'm having trouble connecting right now ("+(e.message||'unknown error')+"). Please try again in a moment."});
      }
      S.recovery.companionTyping=false; R();
    };
    on(w,'#sb-btn','click',send);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
    inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});
  },0);
  return w;
}

// ── Utils ──────────────────────────────────────────────────────
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function on(w,sel,ev,fn){w.querySelector(sel)?.addEventListener(ev,fn);}
function val(id){return document.getElementById(id)?.value||'';}
function opts(w,sel,selCls,circSel,circCls,setter,multi){
  w.querySelectorAll(sel).forEach(e=>e.addEventListener('click',()=>{
    const v=e.dataset.v;
    if(!multi){w.querySelectorAll(sel).forEach(x=>{x.classList.remove(selCls);x.querySelector('.'+circSel)?.classList.remove(circCls);});}
    const isSel=e.classList.contains(selCls);
    if(multi){e.classList.toggle(selCls,!isSel);e.querySelector('.'+circSel)?.classList.toggle(circCls,!isSel);}
    else{e.classList.add(selCls);e.querySelector('.'+circSel)?.classList.add(circCls);}
    setter(v);
  }));
}
function cpPrompt(){const p=['How are you actually feeling today?','What\'s been sitting with you this week?','Tell me about one small thing that felt okay recently.','How are the children doing? And underneath that — how are you?','What does your day look like, and how are you feeling going into it?'];return p[Math.floor(Math.random()*p.length)];}
function wkTheme(d){const wkNum=Math.min(Math.ceil(d/7),13);const wk=getRecoveryWeek(wkNum);return 'Week '+wkNum+' \u00b7 '+wk.title;}
function wkEx(d){const day=getRecoveryDay(d);return day?day.reflection:'Keep going.';}
function milestone(d){if(d<7)return'First week complete';if(d<30)return'One month beside yourself';if(d<60)return'Two months of showing up';return'90-day track complete';}
function mDays(d){if(d<7)return 7-d;if(d<30)return 30-d;if(d<60)return 60-d;return Math.max(91-d,0);}

// ── Boot ───────────────────────────────────────────────────────
async function boot() {
  // Show splash on first ever visit, skip on subsequent
  const splashSeen = LS.get('splashSeen');
  if(!splashSeen){ S.screen='splash'; R(); return; }
  await connectAndLoad();
}

async function connectAndLoad() {
  S.loading=true; S.screen='auth'; R();
  try{
    await initSB(SUPABASE_URL, SUPABASE_KEY);
    const {data:{session}}=await sb.auth.getSession();
    if(session) await handleSession(session); else S.screen='auth';
  }catch(e){
    S.screen='auth';
    S.err='Could not connect. Please try again.';
  }
  S.loading=false; R();
}
boot();
</script>
