<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>beside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --dark: #2D2420; --dark2: #3D2E28; --dark3: #5A3E36;
    --linen: #F5F0EC; --stone: #D9CFC8; --dusk: #8A7A72;
    --terra: #C4907A; --text: #2D2420;
    --serif: 'Lora', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif;
    --r-md: 10px; --r-lg: 16px; --r-pill: 99px;
  }
  html, body { height: 100%; background: #1a1210; font-family: var(--sans); }
  #root { height: 100%; display: flex; justify-content: center; align-items: flex-start; }
  .app-shell { width: 100%; max-width: 430px; min-height: 100vh; background: var(--linen); display: flex; flex-direction: column; overflow: hidden; }
  .screen { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .dark-bg { background: var(--dark); }
  .linen-bg { background: var(--linen); }
  .t-hero { font-family: var(--serif); font-size: 26px; line-height: 1.35; font-weight: 400; }
  .t-title { font-size: 15px; font-weight: 500; }
  .t-body { font-size: 13px; line-height: 1.65; font-weight: 300; }
  .t-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
  .t-muted { color: var(--dusk); }
  .t-light { color: var(--linen); }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px 0; font-size: 12px; font-weight: 500; flex-shrink: 0; }
  .status-dark { background: var(--dark); color: var(--dusk); }
  .status-light { background: var(--linen); color: var(--dusk); }
  .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; text-align: center; display: block; }
  .btn:hover:not(:disabled) { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary-dark { background: var(--terra); color: var(--dark); }
  .btn-primary-light { background: var(--dark); color: var(--linen); }
  .btn-ghost-dark { background: transparent; border: 0.5px solid var(--dark3); color: var(--dusk); }
  .btn-ghost-light { background: transparent; border: 0.5px solid var(--stone); color: var(--dusk); }
  .btn-apple { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-sm { padding: 9px 18px; font-size: 13px; width: auto; }

  .divider-line { flex: 1; height: 0.5px; }
  .divider-dark { background: var(--dark3); }
  .divider-light { background: var(--stone); }
  .divider-text { font-size: 11px; letter-spacing: 0.06em; color: var(--dark3); }
  .input { width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 0.5px solid; font-family: var(--sans); font-size: 13px; outline: none; transition: border-color 0.15s; }
  .input-dark { background: var(--dark2); border-color: var(--dark3); color: var(--linen); }
  .input-dark::placeholder { color: var(--dark3); }
  .input-dark:focus { border-color: var(--dusk); }
  .input-light { background: #fff; border-color: var(--stone); color: var(--text); }
  .input-light::placeholder { color: var(--stone); }
  .input-light:focus { border-color: var(--dark); }
  .card { background: #fff; border-radius: var(--r-lg); border: 0.5px solid var(--stone); overflow: hidden; }
  .card-dark { background: var(--dark); border-radius: var(--r-lg); border: 0.5px solid var(--dark2); overflow: hidden; }
  .card-pad { padding: 14px 16px; }
  .dots { display: flex; gap: 5px; justify-content: center; padding: 10px 0; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dark3); transition: all 0.2s; }
  .dot.active { width: 16px; border-radius: 3px; background: var(--terra); }
  .option { padding: 12px 14px; border-radius: 10px; border: 0.5px solid; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
  .option-dark { border-color: var(--dark3); color: #C4B4AA; }
  .option-dark:hover, .option-dark.sel { background: var(--dark2); border-color: var(--terra); color: var(--linen); }
  .option-light { border-color: var(--stone); color: var(--text); }
  .option-light:hover, .option-light.sel { background: #fff; border-color: var(--dark); }
  .opt-circle { width: 18px; height: 18px; border-radius: 50%; border: 1px solid; flex-shrink: 0; transition: all 0.15s; }
  .opt-circle-dark { border-color: var(--dark3); }
  .opt-circle-dark.sel { background: var(--terra); border-color: var(--terra); }
  .opt-circle-light { border-color: var(--stone); }
  .opt-circle-light.sel { background: var(--dark); border-color: var(--dark); }
  .bottom-nav { background: #fff; border-top: 0.5px solid var(--stone); display: flex; padding: 8px 0 20px; flex-shrink: 0; }
  .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; transition: opacity 0.15s; }
  .nav-tab:hover { opacity: 0.7; }
  .nav-tab-label { font-size: 9px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .nav-tab.active .nav-tab-label { color: var(--dark); }
  .nav-tab:not(.active) .nav-tab-label { color: var(--stone); }
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--dark); }
  .bubble-row { display: flex; align-items: flex-end; gap: 8px; }

  .bubble-u { background: var(--linen); border-radius: 14px 14px 3px 14px; padding: 11px 14px; max-width: 78%; font-size: 13px; line-height: 1.65; color: var(--text); margin-left: auto; }
  .av-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--dark2); border: 0.5px solid var(--terra); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .av-inner { width: 7px; height: 7px; border-radius: 50%; background: var(--terra); }
  .typing-wrap { display: flex; gap: 4px; padding: 14px; background: var(--dark2); border-radius: 14px 14px 14px 3px; align-items: center; }
  .td { width: 5px; height: 5px; border-radius: 50%; background: var(--dusk); animation: pulse 1.2s ease-in-out infinite; }
  .td:nth-child(2){animation-delay:0.2s} .td:nth-child(3){animation-delay:0.4s}
  @keyframes pulse{0%,60%,100%{opacity:0.3;transform:scale(1)}30%{opacity:1;transform:scale(1.25)}}
  .mood-row { display: flex; gap: 6px; }
  .mood-btn { flex: 1; padding: 9px 4px; border-radius: 8px; border: 0.5px solid var(--stone); background: transparent; font-size: 12px; color: var(--dusk); cursor: pointer; font-family: var(--sans); text-align: center; transition: all 0.15s; }
  .mood-btn:hover, .mood-btn.active { background: var(--dark); border-color: var(--dark); color: var(--linen); }
  .mood-e { display: block; font-size: 15px; margin-bottom: 2px; }
  .j-textarea { width: 100%; min-height: 160px; padding: 14px; border-radius: var(--r-md); border: 0.5px solid var(--stone); font-family: var(--serif); font-size: 14px; line-height: 1.7; color: var(--text); resize: none; outline: none; font-style: italic; }
  .j-textarea:focus { border-color: var(--dark); }
  .prog-bar { height: 4px; border-radius: 2px; background: #ede8e3; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 2px; background: var(--terra); }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--dark2); border-radius: var(--r-pill); padding: 4px 12px 4px 8px; }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--terra); }
  .priv-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--dark2); border-radius: 10px; }
  .priv-icon { width: 14px; height: 14px; border-radius: 3px; background: var(--terra); flex-shrink: 0; margin-top: 1px; }
  .err { background: rgba(200,60,60,0.15); border: 0.5px solid rgba(200,60,60,0.4); border-radius: var(--r-md); padding: 10px 12px; font-size: 12px; color: #ff9090; line-height: 1.5; }
  .ok { background: rgba(76,175,80,0.12); border: 0.5px solid rgba(76,175,80,0.4); border-radius: var(--r-md); padding: 10px 12px; font-size: 12px; color: #81c784; line-height: 1.5; }
  .sql-block { background: var(--dark2); border-radius: var(--r-md); padding: 12px 14px; font-family: monospace; font-size: 10px; color: #C4B4AA; line-height: 1.6; border: 0.5px solid var(--dark3); white-space: pre-wrap; word-break: break-all; }
  .field-label { font-size: 11px; font-weight: 500; color: var(--dusk); margin-bottom: 5px; letter-spacing: 0.06em; text-transform: uppercase; }
  .tog-row { display: flex; border: 0.5px solid var(--dark3); border-radius: 8px; overflow: hidden; }
  .tog-btn { flex: 1; padding: 9px; font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; font-family: var(--sans); border: none; transition: all 0.15s; }
  .tog-on { background: var(--terra); color: var(--dark); }
  .tog-off { background: transparent; color: var(--dusk); }
  .lnk { background: none; border: none; cursor: pointer; font-family: var(--sans); font-size: 11px; color: var(--dark3); text-decoration: underline; padding: 0; }
  .scroll-content { flex: 1; overflow-y: auto; }
  .fade-in { animation: fi 0.3s ease forwards; }
  @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  /* ── Faith & Divorce Track — Amber design system ── */
  :root {
    --amber: #BA7517; --amber-light: #FAEEDA; --amber-dark: #854F0B;
    --amber-mid: #EF9F27; --amber-border: #FAC775;
  }
  .btn-faith { background: var(--amber); color: #fff; border: none; }
  .btn-faith-ghost { background: transparent; border: 0.5px solid var(--amber-border); color: var(--amber-dark); }
  .faith-card { background: var(--amber-light); border: 0.5px solid var(--amber-border); border-radius: var(--r-lg); }
  .scripture-block { border-left: 3px solid var(--amber); padding: 10px 14px; font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--amber-dark); background: var(--amber-light); border-radius: 0 var(--r-md) var(--r-md) 0; margin: 8px 0; line-height: 1.7; }
  .faith-av { width: 22px; height: 22px; border-radius: 50%; background: var(--amber-light); border: 0.5px solid var(--amber); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .faith-av-lg { width: 32px; height: 32px; border-radius: 50%; background: var(--amber-light); border: 0.5px solid var(--amber); display: flex; align-items: center; justify-content: center; }
  .cross-icon { display: inline-block; position: relative; width: 12px; height: 12px; }
  .faith-bubble-c { background: var(--amber-light); border-radius: 14px 14px 14px 3px; padding: 11px 14px; max-width: 78%; font-family: var(--serif); font-size: 13px; line-height: 1.7; color: var(--amber-dark); font-style: italic; }
  .faith-bubble-u { background: var(--amber); border-radius: 14px 14px 3px 14px; padding: 11px 14px; max-width: 78%; font-size: 13px; line-height: 1.65; color: #fff; margin-left: auto; }
  .module-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: #fff; border-radius: var(--r-md); border: 0.5px solid var(--stone); cursor: pointer; transition: border-color 0.15s; margin-bottom: 8px; }
  .module-row:hover:not(.module-locked) { border-color: var(--amber-border); }
  .module-row.module-locked { opacity: 0.45; cursor: default; }
  .module-row.module-done { border-color: var(--amber-border); }
  .module-num { width: 28px; height: 28px; border-radius: 50%; background: var(--amber-light); border: 0.5px solid var(--amber-border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--amber-dark); flex-shrink: 0; }
  .module-num.done { background: var(--amber); color: #fff; border-color: var(--amber); }
  .phase-hdr { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber-dark); padding: 14px 0 6px; }
  .faith-progress { height: 4px; border-radius: 2px; background: var(--amber-light); overflow: hidden; }
  .faith-progress-fill { height: 100%; border-radius: 2px; background: var(--amber); }
  .concern-pill { padding: 8px 14px; border-radius: var(--r-pill); border: 0.5px solid; font-size: 13px; cursor: pointer; transition: all 0.15s; display: inline-block; margin: 4px; }
  .concern-off { border-color: var(--stone); color: var(--dusk); background: transparent; }
  .concern-on { border-color: var(--amber); background: var(--amber-light); color: var(--amber-dark); }
  .denom-pill { padding: 7px 14px; border-radius: var(--r-pill); border: 0.5px solid; font-size: 12px; cursor: pointer; transition: all 0.15s; display: inline-block; margin: 4px; }
  .denom-off { border-color: var(--stone); color: var(--dusk); background: transparent; }
  .denom-on { border-color: var(--amber); background: var(--amber-light); color: var(--amber-dark); font-weight: 500; }
  .section-content { font-size: 14px; line-height: 1.8; color: var(--text); margin-bottom: 16px; font-weight: 300; }
  .section-title { font-family: var(--serif); font-size: 17px; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
  .reading-section { padding: 0 0 16px; border-bottom: 0.5px solid var(--stone); margin-bottom: 16px; }
  .reading-section:last-child { border-bottom: none; }
  .faith-toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid var(--stone); }
  .toggle-switch { width: 44px; height: 24px; border-radius: 12px; background: var(--stone); position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
  .toggle-switch.on { background: var(--amber); }
  .toggle-knob { width: 18px; height: 18px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: transform 0.2s; }
  .toggle-switch.on .toggle-knob { transform: translateX(20px); }
</style>

<body>
<div id="root"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const LS = {
  get: k => { try { return localStorage.getItem('bsd_'+k)||''; } catch(e){ return ''; } },
  set: (k,v) => { try { localStorage.setItem('bsd_'+k,v); } catch(e){} },
};

let sb = null;
let S = {
  screen:'setup', sbUrl:LS.get('url'), sbKey:LS.get('key'), anKey:LS.get('akey'),
  authMode:'signin', authEmail:'', authPass:'', authName:'',
  userId:null, userName:'', userStage:'', userPriorities:[],
  obStep:0,
  convs:[], isTyping:false,
  jConvs:[], jIsTyping:false, jPhase:'write',
  todayMood:'', journalEntries:[], jPrompt:'', jText:'', jLoading:false,
  dayCount:1, streak:1,
  err:'', loading:false, verifyPending:false,
  isChristian: null,
  faith: {
    enrolled:false, obStep:0, stage:'', denominations:[], concerns:[],
    journalConsent:false, modulesCompleted:[], currentModule:0,
    jEntries:[], jConvs:[], jIsTyping:false, jPhase:'write',
    jPromptId:'', jPromptText:'', jText:'',
    companionConvs:[], companionTyping:false,
    loading:false, err:'',
  },
};

// ── SQL schema ─────────────────────────────────────────────────
const SQL = `-- Run in Supabase SQL editor (Settings → SQL Editor)

create table if not exists beside_users (
  id uuid primary key references auth.users(id) on delete cascade,
  name text,
  divorce_stage text,
  priorities text[],
  streak int default 1,
  day_count int default 1,
  created_at timestamptz default now()
);
create table if not exists beside_conversations (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references beside_users(id) on delete cascade,
  role text not null, content text not null,
  created_at timestamptz default now()
);
create table if not exists beside_moods (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references beside_users(id) on delete cascade,
  mood text not null, created_at timestamptz default now()
);
create table if not exists beside_journal (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references beside_users(id) on delete cascade,
  prompt text, content text not null,
  created_at timestamptz default now()
);

-- RLS: each user sees only their own data (POPIA-aligned)
alter table beside_users enable row level security;
alter table beside_conversations enable row level security;
alter table beside_moods enable row level security;
alter table beside_journal enable row level security;

drop policy if exists "own_u" on beside_users;
drop policy if exists "own_c" on beside_conversations;
drop policy if exists "own_m" on beside_moods;
drop policy if exists "own_j" on beside_journal;

create policy "own_u" on beside_users for all using (id = auth.uid());
create policy "own_c" on beside_conversations for all using (user_id = auth.uid());
create policy "own_m" on beside_moods for all using (user_id = auth.uid());
create policy "own_j" on beside_journal for all using (user_id = auth.uid());

-- Apple Sign-In: enable at
-- Dashboard → Authentication → Providers → Apple

-- Faith & Divorce Track tables
create table if not exists beside_faith_progress (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references beside_users(id) on delete cascade,
  stage text,
  denominations text[],
  concerns text[],
  journal_consent boolean default false,
  modules_completed int[] default '{}',
  enrolled_at timestamptz default now()
);
create table if not exists beside_faith_journal (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references beside_users(id) on delete cascade,
  module_num int,
  prompt_id text,
  prompt_text text,
  content text not null,
  created_at timestamptz default now()
);
alter table beside_faith_progress enable row level security;
alter table beside_faith_journal enable row level security;
drop policy if exists "own_fp" on beside_faith_progress;
drop policy if exists "own_fj" on beside_faith_journal;
create policy "own_fp" on beside_faith_progress for all using (user_id = auth.uid());
create policy "own_fj" on beside_faith_journal for all using (user_id = auth.uid());`;

// ── DB helpers ─────────────────────────────────────────────────
async function initSB(url, key) {
  sb = createClient(url, key);
  const { error } = await sb.from('beside_users').select('id').limit(1);
  if (error && !error.message.includes('JWT') && !error.message.includes('policy'))
    throw new Error('Cannot connect. Check your URL and anon key, and confirm the schema is set up.');
}

async function getOrCreateProfile(authUser, name) {
  const { data: ex } = await sb.from('beside_users').select('*').eq('id', authUser.id).single();
  if (ex) return ex;
  const n = name || authUser.user_metadata?.full_name || authUser.email?.split('@')[0] || 'Friend';
  const { data, error } = await sb.from('beside_users')
    .insert({ id: authUser.id, name: n, streak: 1, day_count: 1 }).select().single();
  if (error) throw error;
  return data;
}

async function updateProfile(fields) {
  await sb.from('beside_users').update(fields).eq('id', S.userId);
}

async function loadConvs() {
  const { data } = await sb.from('beside_conversations')
    .select('*').eq('user_id', S.userId).order('created_at',{ascending:true}).limit(40);
  return data || [];
}

async function saveMsg(role, content) {
  await sb.from('beside_conversations').insert({ user_id: S.userId, role, content });
}

async function saveMood(mood) {
  await sb.from('beside_moods').insert({ user_id: S.userId, mood });
}

async function loadTodayMood() {
  const d = new Date(); d.setHours(0,0,0,0);
  const { data } = await sb.from('beside_moods').select('mood').eq('user_id',S.userId)
    .gte('created_at',d.toISOString()).order('created_at',{ascending:false}).limit(1);
  return data?.[0]?.mood||'';
}

async function saveJournal(prompt, content) {
  const { data, error } = await sb.from('beside_journal')
    .insert({ user_id: S.userId, prompt, content }).select().single();
  if (error) throw error;
  return data;
}

async function loadJournals() {
  const { data } = await sb.from('beside_journal').select('*')
    .eq('user_id',S.userId).order('created_at',{ascending:false}).limit(20);
  return data || [];
}

async function signOut() {
  await sb.auth.signOut();
  Object.assign(S, { userId:null, userName:'', userStage:'', userPriorities:[], convs:[], journalEntries:[], jPrompt:'', jText:'', todayMood:'', screen:'auth', authEmail:'', authPass:'', authName:'' });
  render();
}

async function deleteAllData() {
  // Delete all user data rows — RLS ensures only this user's data is touched
  await sb.from('beside_conversations').delete().eq('user_id', S.userId);
  await sb.from('beside_moods').delete().eq('user_id', S.userId);
  await sb.from('beside_journal').delete().eq('user_id', S.userId);
  await sb.from('beside_users').delete().eq('id', S.userId);
  // Delete the auth account via Edge Function (admin action)
  const r = await fetch(S.sbUrl + '/functions/v1/delete-account', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.sbKey },
    body: JSON.stringify({ userId: S.userId })
  });
  // Sign out regardless of whether auth deletion succeeded
  await sb.auth.signOut();
  Object.assign(S, { userId:null, userName:'', userStage:'', userPriorities:[], convs:[], journalEntries:[], jPrompt:'', jText:'', todayMood:'', screen:'auth', authEmail:'', authPass:'', authName:'', err:'' });
  render();
}

// ── Faith track DB helpers ────────────────────────────────────
async function saveFaithProgress(fields) {
  const { data: ex } = await sb.from('beside_faith_progress').select('id').eq('user_id', S.userId).single();
  if (ex) { await sb.from('beside_faith_progress').update(fields).eq('user_id', S.userId); }
  else { await sb.from('beside_faith_progress').insert({ user_id: S.userId, ...fields }); }
}

async function ai(messages, system) {
  // Calls Supabase Edge Function proxy to avoid CORS restrictions
  const proxyUrl = S.sbUrl + '/functions/v1/companion';
  const r = await fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.sbKey },
    body: JSON.stringify({ messages, system, apiKey: S.anKey })
  });
  if (!r.ok) {
    let msg = 'Proxy error';
    try { const e = await r.json(); msg = e.error?.message || JSON.stringify(e); } catch(_) {}
    throw new Error(r.status + ': ' + msg);
  }
  const data = await r.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.content[0].text;
}

async function handleEmailAuth() {
  const email=(document.getElementById('a-email')?.value||S.authEmail).trim();
  const pass=document.getElementById('a-pass')?.value||S.authPass;
  const name=(document.getElementById('a-name')?.value||S.authName).trim();
  if(!email||!pass){S.err='Please enter your email and password.';R();return;}
  S.loading=true;S.err='';R();
  try{
    if(S.authMode==='signup'){
      if(pass.length<8)throw new Error('Password must be at least 8 characters.');
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name||email.split('@')[0]}}});
      if(error)throw error;
      if(!data.session){S.verifyPending=true;S.loading=false;R();return;}
      await handleSession(data.session,name);
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      await handleSession(data.session);
    }
  }catch(e){S.err=e.message.replace('AuthApiError: ','');}
  S.loading=false;R();
}

async function handleAppleAuth() {
  if(!sb){S.err='Not connected.';R();return;}
  S.loading=true;S.err='';R();
  try{
    const {error}=await sb.auth.signInWithOAuth({
      provider:'apple',
      options:{redirectTo:window.location.href.split('#')[0].split('?')[0],scopes:'name email'}
    });
    if(error)throw error;
    // Redirect happens — show nothing, browser leaves page
  }catch(e){
    S.err='Apple Sign-In failed: '+e.message+'. Enable Apple in Supabase Dashboard → Authentication → Providers.';
    S.loading=false;R();
  }
}

async function handleSession(session, overrideName) {
  const u = session.user;
  try{
    const profile = await getOrCreateProfile(u, overrideName||S.authName||u.user_metadata?.full_name);
    S.userId=profile.id; S.userName=profile.name; S.userStage=profile.divorce_stage||'';
    S.userPriorities=profile.priorities||[]; S.dayCount=profile.day_count||1; S.streak=profile.streak||1;
    if(!profile.divorce_stage){ S.screen='onboarding'; S.obStep=1; }
    else {
      const fp=await loadFaithProgress();
      if(fp){
        S.faith.enrolled=true; S.faith.stage=fp.stage||''; S.faith.denominations=fp.denominations||[];
        S.faith.concerns=fp.concerns||[]; S.faith.journalConsent=fp.journal_consent||false;
        S.faith.modulesCompleted=fp.modules_completed||[]; S.isChristian=true;
      }
      S.faith.jEntries=await loadFaithJournals();
      await loadHomeData(); S.screen='home';
    }
  }catch(e){ S.err='Could not load profile: '+e.message; S.screen='auth'; }
}

async function loadJData() {
  S.journalEntries=await loadJournals();
  if(!S.jPrompt){
    S.jLoading=true; R();
    try{ S.jPrompt=await ai([{role:'user',content:'prompt'}],SYS_JOURNAL()); }
    catch(e){ S.jPrompt='What has surprised you most about yourself in the last few weeks?'; }
    S.jLoading=false;
  }
}

function rJournal() {
  const w = el('div','screen linen-bg');
  // Phase: 'write' = prompt + textarea, 'reflect' = saved + companion chat
  if(S.jPhase==='reflect') return rJournalReflect(w);
  return rJournalWrite(w);
}

function rJournalWrite(w) {
  const ents=S.journalEntries.slice(0,4);
  w.innerHTML=`
    <div class="status-bar status-light"><span>9:41</span><span>●●●</span></div>
    <div style="padding:10px 20px 14px;border-bottom:0.5px solid var(--stone);flex-shrink:0">
      <div class="t-label t-muted" style="margin-bottom:4px">Your journal</div>
      <div style="font-family:var(--serif);font-size:20px;color:var(--text)">A private record.</div>
    </div>
    <div class="scroll-content" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div class="card">
        <div style="background:var(--dark);padding:12px 16px;border-radius:var(--r-lg) var(--r-lg) 0 0">
          <div class="t-label" style="color:var(--dusk);margin-bottom:6px">Today's prompt</div>
          <div style="font-family:var(--serif);font-size:14px;color:var(--linen);line-height:1.7;font-style:italic">${S.jLoading?'Finding a prompt for you…':S.jPrompt}</div>
        </div>
        <div style="padding:12px 16px">
          <textarea id="ji" class="j-textarea" placeholder="Write here — this is only for you…">${S.jText}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <button id="np-btn" class="btn btn-ghost-light btn-sm" style="font-size:12px">New prompt</button>
            <button id="sv-btn" class="btn btn-primary-light btn-sm">Save & reflect</button>
          </div>
          ${S.err?`<div class="err" style="margin-top:8px">${S.err}</div>`:''}
        </div>
      </div>
      ${ents.length?`<div class="t-label t-muted" style="padding:0 2px">Recent entries</div>
        ${ents.map(e=>`<div class="card" style="padding:12px 14px;cursor:pointer" data-entry-id="${e.id}">
          <div class="t-label t-muted" style="margin-bottom:5px">${new Date(e.created_at).toLocaleDateString('en-ZA',{day:'numeric',month:'long'})}</div>
          ${e.prompt?`<div style="font-family:var(--serif);font-size:12px;color:var(--dusk);font-style:italic;margin-bottom:5px">${e.prompt}</div>`:''}
          <div class="t-body" style="color:var(--text);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${e.content}</div>
          <div style="margin-top:8px;font-size:11px;color:var(--terra)">Tap to reflect on this entry →</div>
        </div>`).join('')}`:`<div style="text-align:center;padding:20px 0;font-family:var(--serif);font-size:15px;color:var(--dusk);font-style:italic">Your entries will appear here.</div>`}
      <div style="height:8px"></div>
    </div>`;
  const ji=w.querySelector('#ji'); ji.addEventListener('input',()=>S.jText=ji.value);
  on(w,'#np-btn','click',async()=>{S.jPrompt='';S.jText='';S.err='';R();await loadJData();R();});
  on(w,'#sv-btn','click',async()=>{
    const t=S.jText.trim(); if(!t)return; S.err='';
    try{
      await saveJournal(S.jPrompt,t);
      S.journalEntries=await loadJournals();
      // Switch to reflect phase — companion responds to the entry
      S.jConvs=[]; S.jIsTyping=true; S.jPhase='reflect'; R();
      try{
        const reply=await ai(
          [{role:'user',content:S.jText}],
          SYS_JOURNAL_REFLECT(S.jPrompt,S.jText)
        );
        S.jConvs=[{role:'assistant',content:reply}];
      }catch(e){
        S.jConvs=[{role:'assistant',content:"I'm having a little trouble right now. Take your time — I'll be here when you're ready to talk about what you wrote."}];
      }
      S.jIsTyping=false; S.jText=''; R();
    }catch(e){ S.err='Could not save. Check your connection.'; R(); }
  });
  // Tap past entry to reflect
  w.querySelectorAll('[data-entry-id]').forEach(card=>{
    card.addEventListener('click',()=>{
      const entry=S.journalEntries.find(e=>e.id===card.dataset.entryId);
      if(!entry)return;
      S.jConvs=[]; S.jIsTyping=true; S.jPhase='reflect';
      S.jPrompt=entry.prompt||''; S.jText=entry.content; R();
      ai([{role:'user',content:entry.content}],SYS_JOURNAL_REFLECT(entry.prompt||'',entry.content))
        .then(reply=>{ S.jConvs=[{role:'assistant',content:reply}]; S.jIsTyping=false; R(); })
        .catch(()=>{ S.jConvs=[{role:'assistant',content:"I'm here whenever you're ready to talk about this."}]; S.jIsTyping=false; R(); });
    });
  });
  return w;
}

      <div style="font-family:var(--serif);font-size:13px;color:var(--text);font-style:italic;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${S.jText}</div>

    on(w,'#bk-j','click',()=>{S.jPhase='write';S.jText='';S.jPrompt='';S.jConvs=[];R();});

      inp.value=''; inp.style.height='auto';

        const msgs=[

          ...S.jConvs.slice(0,-1).map(m=>({role:m.role,content:m.content})),
          {role:'user',content:t}

    inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});
  },0);
  return w;

        </div>
        <div id="faith-companion-btn" style="background:var(--amber);border-radius:99px;padding:5px 12px;font-size:11px;font-weight:500;color:#fff;cursor:pointer">Talk</div>
      </div>
      <div class="faith-progress" style="margin-bottom:6px"><div class="faith-progress-fill" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--amber-dark)">
        <span>${done.length} of ${total} modules</span>
        <span>${faithPhases.find(p=>p.modules.includes(nextM.num))?.title||''}</span>
      </div>
    </div>
    <div class="scroll-content" style="padding:14px;display:flex;flex-direction:column">
      ${faithPhases.map(phase=>`
        <div class="phase-hdr">${phase.title}</div>
        ${FAITH_MODULES.filter(m=>m.phase===phase.num).map(m=>{
          const isDone=done.includes(m.num);
          const isNext=m.num===nextM.num&&!isDone;
          const isLocked=!isDone&&m.num>(done.length?Math.max(...done)+1:1)&&!isNext;
          return `<div class="module-row ${isDone?'module-done':''} ${isLocked?'module-locked':''}" data-mnum="${m.num}">
            <div class="module-num ${isDone?'done':''}">${isDone?'✓':m.num}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:${isNext?'500':'400'};color:${isLocked?'var(--stone)':isNext?'var(--amber-dark)':'var(--text)'}">${m.title}</div>
              <div style="font-size:11px;color:var(--dusk);margin-top:2px;line-height:1.4">${m.purpose.split(',')[0]}</div>
            </div>
            ${isNext?`<div style="font-size:10px;font-weight:500;color:var(--amber);background:var(--amber-light);padding:3px 8px;border-radius:99px;border:0.5px solid var(--amber-border)">Next</div>`:''}
            ${isLocked?`<div style="font-size:16px;color:var(--stone)">🔒</div>`:''}
          </div>`;
        }).join('')}
      `).join('')}
      <div style="height:10px"></div>
    </div>`;

  on(w,'#faith-companion-btn','click',()=>{
    if(!S.faith.companionConvs.length){
      const op=`Welcome back. This is a space for the questions and the grief that doesn't always fit elsewhere. What's on your heart today?`;
      S.faith.companionConvs=[{role:'assistant',content:op}];
    }
    S.screen='faithCompanion'; R();
  });
  w.querySelectorAll('[data-mnum]').forEach(el=>{
    el.addEventListener('click',()=>{
      const num=parseInt(el.dataset.mnum);
      const mod=getFaithModule(num);
      const isDone=done.includes(num);
      const isLocked=!isDone&&num>(done.length?Math.max(...done)+1:1)&&num!==nextM.num;
      if(isLocked) return;
      S.faith.currentModule=num;
      S.screen='faithModule'; R();
    });
  });
  return w;
}

      <div style="background:var(--amber-light);border-radius:var(--r-lg);overflow:hidden;border:0.5px solid var(--amber-border)">
        <div style="background:var(--amber);padding:12px 16px">
          <div style="font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.7);margin-bottom:5px">Module ${S.faith.jPromptId?S.faith.jPromptId.split('.')[0]:''} prompt</div>
          <div style="font-family:var(--serif);font-size:14px;color:#fff;line-height:1.7;font-style:italic">"${S.faith.jPromptText}"</div>
        </div>
        <div style="padding:12px 16px">
          <textarea id="fji" class="j-textarea" style="border-color:var(--amber-border)" placeholder="Write here — this is private, just for you…">${S.faith.jText}</textarea>

          </div>
        </div>
      </div>` : `
      <div class="faith-card" style="padding:14px">
        <div class="t-label" style="color:var(--amber);margin-bottom:8px">Choose a prompt</div>
        <div style="font-size:13px;color:var(--dusk);line-height:1.6;margin-bottom:10px">Work through a module to unlock its journal prompt, or choose from the prompts below.</div>

      ${ents.length?`
        <div class="t-label t-muted" style="padding:0 2px">Previous entries</div>
        ${ents.map(e=>`<div class="card" style="padding:12px 14px;cursor:pointer" data-eid="${e.id}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
            <div class="t-label t-muted">${new Date(e.created_at).toLocaleDateString('en-ZA',{day:'numeric',month:'long'})}</div>
            ${e.module_num?`<div style="font-size:10px;font-weight:500;color:var(--amber);background:var(--amber-light);padding:2px 8px;border-radius:99px;border:0.5px solid var(--amber-border)">Module ${e.module_num}</div>`:''}
          </div>
          ${e.prompt_text?`<div style="font-family:var(--serif);font-size:12px;color:var(--dusk);font-style:italic;margin-bottom:5px">${e.prompt_text}</div>`:''}
          <div style="font-size:13px;color:var(--text);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${e.content}</div>

        </div>`).join('')}`:''}
      <div style="height:8px"></div>
    </div>`;
  const fji=w.querySelector('#fji');
  if(fji) fji.addEventListener('input',()=>S.faith.jText=fji.value);
  on(w,'#clear-prompt','click',()=>{S.faith.jPromptId='';S.faith.jPromptText='';S.faith.jText='';R();});
  on(w,'#fsv-btn','click',async()=>{
    const t=S.faith.jText.trim(); if(!t)return;
    S.faith.err='';
    try{
      const modNum=S.faith.jPromptId?parseInt(S.faith.jPromptId.split('.')[0]):null;
      await saveFaithJournal(modNum,S.faith.jPromptId,S.faith.jPromptText,t);
      S.faith.jEntries=await loadFaithJournals();
      S.faith.jConvs=[]; S.faith.jIsTyping=true; S.faith.jPhase='reflect'; R();
      try{
        const reply=await ai([{role:'user',content:t}],SYS_FAITH_COMPANION()+`\n\nThe user just wrote this journal entry in response to the prompt "${S.faith.jPromptText}". Respond warmly — you just read something personal. Notice one specific thing and ask one open question. 3 sentences max.`);
        S.faith.jConvs=[{role:'assistant',content:reply}];
      }catch(e){ S.faith.jConvs=[{role:'assistant',content:"Thank you for writing that. It takes something to put those words down. I'm here whenever you want to talk about what came up."}]; }
      S.faith.jIsTyping=false; S.faith.jText=''; R();
    }catch(e){ S.faith.err='Could not save. Check your connection.'; R(); }
  });
  w.querySelectorAll('[data-eid]').forEach(card=>{
    card.addEventListener('click',()=>{
      const entry=S.faith.jEntries.find(e=>e.id===card.dataset.eid);
      if(!entry)return;
      S.faith.jPromptText=entry.prompt_text||''; S.faith.jText=entry.content;
      S.faith.jConvs=[]; S.faith.jIsTyping=true; S.faith.jPhase='reflect'; R();
      ai([{role:'user',content:entry.content}],SYS_FAITH_COMPANION()+`\n\nThe user wants to reflect on an older journal entry. Respond as someone who has just re-read something meaningful. Notice one specific thing and invite them deeper. 3 sentences max.`)
        .then(reply=>{S.faith.jConvs=[{role:'assistant',content:reply}];S.faith.jIsTyping=false;R();})
        .catch(()=>{S.faith.jConvs=[{role:'assistant',content:"I'm here whenever you're ready to talk about this."}];S.faith.jIsTyping=false;R();});
    });
  });
  return w;
}

// ── Utils ──────────────────────────────────────────────────────
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function on(w,sel,ev,fn){w.querySelector(sel)?.addEventListener(ev,fn);}
function val(id){return document.getElementById(id)?.value||'';}
function opts(w,sel,selCls,circSel,circCls,setter,multi){
  w.querySelectorAll(sel).forEach(e=>e.addEventListener('click',()=>{
    const v=e.dataset.v;
    if(!multi){w.querySelectorAll(sel).forEach(x=>{x.classList.remove(selCls);x.querySelector('.'+circSel)?.classList.remove(circCls);});}
    const isSel=e.classList.contains(selCls);
    if(multi){e.classList.toggle(selCls,!isSel);e.querySelector('.'+circSel)?.classList.toggle(circCls,!isSel);}
    else{e.classList.add(selCls);e.querySelector('.'+circSel)?.classList.add(circCls);}
    setter(v);
  }));
}
function cpPrompt(){const p=['How are you actually feeling today?','What\'s been sitting with you this week?','Tell me about one small thing that felt okay recently.','How are the children doing? And underneath that — how are you?','What does your day look like, and how are you feeling going into it?'];return p[Math.floor(Math.random()*p.length)];}
function wkTheme(d){const t=['Week 1 · Grounding','Week 2 · Grief','Week 3 · Children','Week 4 · Identity','Week 5 · Routine','Week 6 · Social life','Week 7 · Finances','Week 8 · Self-worth','Week 9 · New chapter','Week 10 · Looking forward'];return t[Math.min(Math.floor((d-1)/7),t.length-1)];}
function wkEx(d){const e=['What does safety feel like for you right now?','Letting yourself grieve what you lost.','How to talk to your children with honesty.','Who are you outside this marriage?','Building routines that belong to you.','The friendships worth keeping.','Your financial ground truth.','What you\'ve learned about yourself.','Imagining your next chapter.','The person you\'re becoming.'];return e[Math.min(Math.floor((d-1)/7),e.length-1)];}
function milestone(d){if(d<7)return'First week complete';if(d<30)return'One month beside yourself';if(d<60)return'Two months of showing up';return'90-day track complete';}
function mDays(d){if(d<7)return 7-d;if(d<30)return 30-d;if(d<60)return 60-d;return Math.max(90-d,0);}

// ── Boot ───────────────────────────────────────────────────────
async function boot() {
  const u=LS.get('url'),k=LS.get('key'),a=LS.get('akey');
  if(!u||!k||!a){S.screen='setup';R();return;}
  S.sbUrl=u;S.sbKey=k;S.anKey=a;S.loading=true;R();
  try{
    await initSB(u,k);
    const {data:{session}}=await sb.auth.getSession();
    if(session) await handleSession(session); else S.screen='auth';
  }catch(e){
    // Don't wipe credentials on error — show auth screen with a notice
    S.screen='auth';
    S.err='Could not connect to Supabase: '+e.message+'. Check your credentials in settings.';
  }
  S.loading=false;R();
}
boot();
